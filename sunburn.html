<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>일소피해 피해율 계산기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* 입력칸 커서/탭 시 전체선택 (마늘 참고) */
function bindMobileFocusHandlers(){
  var selectors='input.inp, select.inp, input[type=number], input[type=text], .samp-cell input, .grade-cell input';
  document.querySelectorAll(selectors).forEach(function(el){
    if(el.dataset.mobileFocusBound==='1') return;
    if(el.readOnly) return;
    el.dataset.mobileFocusBound='1';
    el.addEventListener('focus',function(){ try{el.select();}catch(_){} },{passive:true});
    var isSelect=el.tagName==='SELECT';
    var isDate=el.type==='date';
    if(!isSelect && !isDate){
      el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    }
    if(!isSelect && !isDate){
      var _tsx=0,_tsy=0,_scrolling=false;
      el.addEventListener('touchstart',function(e){ _tsx=e.touches[0].clientX; _tsy=e.touches[0].clientY; _scrolling=false; },{passive:true});
      el.addEventListener('touchmove',function(e){ if(Math.abs(e.touches[0].clientX-_tsx)>6||Math.abs(e.touches[0].clientY-_tsy)>6) _scrolling=true; },{passive:true});
      el.addEventListener('touchend',function(e){
        if(_scrolling) return;
        if(e.cancelable) e.preventDefault();
        el.focus();
        setTimeout(function(){ try{ el.select(); }catch(_){ try{ el.setSelectionRange(0,(el.value||'').length); }catch(__){} } },50);
      },{passive:false});
    }
  });
}
document.addEventListener('DOMContentLoaded',function(){
  bindMobileFocusHandlers();
  document.addEventListener('click',function(){ setTimeout(bindMobileFocusHandlers,0); },{passive:true});
});
</script>
<style>
:root{
  --blue:#185FA5;--blue2:#378ADD;
  --auto:#F3F1EA;--border:#D8D6CE;--binp:#378ADD;
  --text:#1a1a1a;--sub:#666;--hint:#aaa;
  --bg:#F5F4F0;--card:#fff;
  --red:#e24b4a;--green:#1D9E75;--amber:#C2410C;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-user-select:none;user-select:none;padding-bottom:env(safe-area-inset-bottom,30px)}
.header{background:var(--blue);color:white;padding:13px 14px 11px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.back-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,0.15);border-radius:8px;cursor:pointer;flex-shrink:0;color:#fff;text-decoration:none}
.header-icon{width:30px;height:30px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.header h1{font-size:16px;font-weight:700;flex:1}
.header-sub{font-size:10.5px;opacity:0.72;margin-top:1px}
.legend{display:flex;gap:12px;padding:8px 16px;background:var(--card);border-bottom:0.5px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.dot-inp{width:10px;height:10px;border-radius:2px;background:white;border:1.5px solid var(--binp)}
.dot-filled{width:10px;height:10px;border-radius:2px;background:#e8faf3;border:1.5px solid var(--green)}
.dot-auto{width:10px;height:10px;border-radius:2px;background:var(--auto);border:0.5px solid var(--border)}

.content{padding:12px 14px 40px}
.section{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 13px 13px;margin-bottom:11px}
.sec-title{font-size:13px;font-weight:800;color:var(--text);letter-spacing:-0.01em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-title .tag{font-size:10px;font-weight:700;color:var(--blue);background:#eaf2fb;border-radius:6px;padding:2px 7px}
.subhead{font-size:11px;font-weight:800;color:var(--blue);margin:11px 0 6px;letter-spacing:-0.01em}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;position:relative}
.field label{font-size:11px;color:var(--sub);font-weight:600;line-height:1.25}
/* 기본정보 드롭다운 글자 잘림 방지 (조사방식·가입상품·적과전사고·재해종류) */
#method,#product,#prevAcc,#disaster{font-size:12.5px;padding:0 4px;letter-spacing:-0.03em}
#method,#product,#prevAcc,#disaster{text-align:center;text-align-last:center}
body.big-text #method,body.big-text #product,body.big-text #prevAcc,body.big-text #disaster{font-size:15px !important;padding:0 4px !important}
.field .unit{font-size:10px;color:var(--hint);font-weight:500}
input.inp,select.inp{height:42px;border:1.5px solid var(--binp);border-radius:var(--rs);padding:0 8px;font-size:15px;font-weight:600;background:white;color:var(--text);width:100%;text-align:center;transition:background .15s,border-color .15s;-webkit-appearance:none;appearance:none}
select.inp{text-align:left;-webkit-appearance:auto;appearance:auto}
input.inp:focus,select.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,0.18);background:#dceeff;color:var(--blue)}
input.inp.filled{background:#e8faf3;border-color:var(--green);color:#0d5c35}
select.inp.filled{background:#e8faf3;border-color:var(--green);color:#0d5c35;font-weight:700}
input.inp.filled:focus,select.inp.filled:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,0.18);background:#dceeff;color:var(--blue)}
input.inp::placeholder{color:var(--hint);font-weight:500;opacity:1}
input.inp::-webkit-input-placeholder{color:var(--hint);font-weight:500}
input.inp:-ms-input-placeholder{color:var(--hint);font-weight:500}
input.auto{height:42px;border:0.5px solid var(--border);border-radius:var(--rs);padding:0 6px;font-size:15px;font-weight:700;background:var(--auto);color:var(--text);width:100%;text-align:center;-webkit-appearance:none}
body.big-text input.auto{height:52px !important;font-size:18px !important;font-weight:800 !important}
.hint{font-size:10.5px;color:var(--hint);margin-top:7px;line-height:1.5}

.datewrap{position:relative}
.datewrap input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.date-disp{height:42px;border:1.5px solid var(--binp);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:#fff;color:var(--text)}
.date-disp.ph{color:var(--hint);font-weight:500}
.date-disp.filled{background:#e8faf3;border-color:var(--green);color:#0d5c35}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bigtext-btn{height:34px;padding:0 12px;background:transparent;border:1.5px solid var(--blue2);border-radius:var(--rs);color:var(--blue2);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.bigtext-btn.on{background:var(--blue2);color:#fff;box-shadow:0 2px 8px rgba(55,138,221,0.35)}
.reset-btn{height:34px;padding:0 14px;background:transparent;border:1.5px solid var(--red);border-radius:var(--rs);color:var(--red);font-size:13px;font-weight:600;cursor:pointer}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg-btn{height:40px;border:1.5px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s}
.seg-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(24,95,165,0.28)}

/* 표본 낙과수 가로 1행 */
.samp-line{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.samp-cell{flex:1;min-width:52px;text-align:center}
.samp-cell .no{font-size:10px;font-weight:700;color:var(--sub);margin-bottom:3px}
.samp-cell input{height:42px;padding:0 2px;font-size:15px}
.samp-total{flex:1;min-width:60px;text-align:center}
.samp-total .no{font-size:10px;font-weight:700;color:var(--blue);margin-bottom:3px}
.samp-total .box{height:42px;border:1.5px solid var(--blue);border-radius:var(--rs);background:#eaf2fb;color:var(--blue);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}

/* 표본조사 세로 표: 표본번호·숙기/품종·표본낙과수 */
.samp-table{width:100%;border-collapse:collapse}
.samp-table th{font-size:11px;font-weight:700;color:var(--sub);padding:0 4px 7px;text-align:center}
.samp-table td{padding:3px 3px;vertical-align:middle}
.samp-table .samp-no{text-align:center;font-size:14px;font-weight:800;color:var(--blue);padding:3px 1px}
.samp-table input{height:42px;padding:0 8px;font-size:15px;text-align:center}
.samp-table input.samp-variety{font-size:13px}
.samp-table .samp-cell{display:flex;flex-direction:row;gap:5px;align-items:center}
.samp-table select.samp-sukgi{flex:0 0 62px;height:42px;font-size:12px;padding:0 2px;text-align:center;text-align-last:center}
.samp-table .pj-wrap{flex:1;min-width:0;display:block}
.samp-table select.samp-pumjong-sel,.samp-table input.samp-pumjong-txt{width:100%;height:42px;font-size:12px;padding:0 4px;text-align:center;text-align-last:center}
.samp-total-row .samp-total-label{text-align:right;font-size:12px;font-weight:800;color:var(--blue);padding-right:10px}
.samp-total-box{height:42px;border:1.5px solid var(--blue);border-radius:var(--rs);background:#eaf2fb;color:var(--blue);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}

.grade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade-cell label{font-size:10.5px;text-align:center;display:block;margin-bottom:3px;color:var(--sub);font-weight:700}
.grade-cell input{height:40px;font-size:14px;padding:0 2px}
.grade-100 label{color:var(--red)}

.calc-action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.btn-calc{height:48px;border:none;border-radius:12px;background:var(--blue);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-calc.active{background:linear-gradient(135deg,#185FA5 0%,#2478cc 100%);box-shadow:0 4px 14px rgba(24,95,165,0.35)}
.btn-edit{height:48px;border:2px solid var(--green);border-radius:12px;background:white;color:var(--green);font-size:15px;font-weight:700;cursor:pointer}
.btn-edit.active{background:var(--green);color:white;box-shadow:0 4px 14px rgba(29,158,117,0.3)}
.locked .section input.inp:not([type=date]),.locked .section select.inp,.locked .seg-btn,.locked .samp-cell input{pointer-events:none;opacity:0.78}

.result-box{background:linear-gradient(135deg,#6b7280 0%,#8a929d 100%);border-radius:18px;padding:16px 16px 14px;margin-bottom:10px;color:white;box-shadow:0 8px 28px rgba(90,98,110,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}
.result-box.pending{background:linear-gradient(135deg,#9a9a9a 0%,#bbb 100%);box-shadow:none}
.rb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rb-label{font-size:12px;opacity:0.82;font-weight:600}
.rb-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.3)}
.rb-hero{font-size:40px;font-weight:900;letter-spacing:-0.02em;line-height:1.05}
.rb-hero small{font-size:18px;font-weight:700;opacity:0.85}
.rb-sub{font-size:12px;opacity:0.85;margin-top:5px}
.rb-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.rb-mini .m{background:rgba(255,255,255,0.13);border-radius:10px;padding:8px 10px}
.rb-mini .m .k{font-size:10px;opacity:0.8}
.rb-mini .m .v{font-size:16px;font-weight:800;margin-top:1px}
.save-btn{height:36px;padding:0 10px;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);color:#fff;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;flex-shrink:0}
.save-btn:active{background:rgba(255,255,255,0.35)}
.save-btn:disabled{opacity:0.45;cursor:default}

.res-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:10px;overflow:hidden;border:0.5px solid var(--border)}
.res-table td{padding:9px 10px;border-bottom:1px solid #eee}
.res-table tr:last-child td{border-bottom:none}
.res-table td.k{color:var(--sub);font-weight:600;width:54%}
.res-table td.v{text-align:right;font-weight:800;color:var(--text)}
.res-table tr.hl td{background:#eaf2fb}
.res-table tr.hl td.v{color:var(--blue)}
.res-table .formula{font-size:10px;color:var(--hint);font-weight:500;display:block;margin-top:1px}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:18px 16px;width:100%;max-width:340px;max-height:80vh;display:flex;flex-direction:column}
.modal h3{font-size:17px;font-weight:800;text-align:center;margin-bottom:6px;color:#333}
.hist-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:0.95}
.save-modal{background:#fff;border-radius:16px;padding:24px 20px;text-align:center;width:260px}
.save-modal p{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text)}
.save-modal .btn-ok{width:100%;height:44px;background:var(--blue);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer}

body.big-text input.inp,body.big-text select.inp{height:52px !important;font-size:20px !important;font-weight:700 !important;border-width:2px !important}
body.big-text .date-disp{height:52px !important;font-size:17px !important;font-weight:800 !important}
body.big-text .field label{font-size:13px !important}
body.big-text .samp-cell input{height:50px !important;font-size:18px !important}
body.big-text .samp-total .box{height:50px !important;font-size:18px !important}
body.big-text .samp-table input{height:50px !important;font-size:18px !important}
body.big-text .samp-table input.samp-variety{font-size:15px !important}
body.big-text .samp-table select.samp-sukgi,body.big-text .samp-table select.samp-pumjong-sel,body.big-text .samp-table input.samp-pumjong-txt{height:46px !important;font-size:13px !important}
body.big-text .samp-total-box{height:50px !important;font-size:18px !important}
body.big-text .grade-cell input{height:48px !important;font-size:16px !important}
body.big-text .seg-btn{height:48px !important;font-size:15px !important}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="./index.html">‹</a>
  <div class="header-icon">☀️</div>
  <div style="flex:1">
    <h1>일소피해 피해율 계산기</h1>
    <div class="header-sub">과수4종 · 적과후 · 낙과(표본)조사</div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><span class="dot-inp"></span>직접입력</div>
  <div class="legend-item"><span class="dot-filled"></span>입력완료</div>
  <div class="legend-item"><span class="dot-auto"></span>자동계산</div>
</div>

<div class="content" id="content">

  <!-- 크게 / 전체초기화 / 품목 / 농지번호 / 이전기록 -->
  <div class="section">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px">
      <button class="bigtext-btn" id="bigtextBtn" onclick="toggleBigText()">🔍 <span id="bigtextLabel">크게</span></button>
      <button class="reset-btn" onclick="openReset()">전체 초기화</button>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <div class="field" style="width:40%">
        <label>품목</label>
        <select class="inp filled" id="crop" onchange="mark(this);updatePumjongList();saveState()" style="text-align:center;text-align-last:center">
          <option value="사과" selected>사과</option>
          <option value="배">배</option>
          <option value="단감">단감</option>
          <option value="떫은감">떫은감</option>
        </select>
      </div>
      <div class="field" style="width:40%">
        <label>농지번호 4자리</label>
        <input type="text" id="farmNo" class="inp" inputmode="numeric" placeholder="농지번호 4자리" maxlength="4"
          oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4);mark(this);saveState()"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" autocomplete="off">
      </div>
      <div style="width:20%;flex-shrink:0">
        <button onclick="openHistory()" title="이전 기록 불러오기"
          style="width:100%;height:46px;border:1.5px solid var(--blue2);border-radius:var(--rs);background:white;color:var(--blue);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">📋</button>
      </div>
    </div>
  </div>

  <!-- 기본정보 -->
  <div class="section">
    <div class="sec-title">📋 기본정보</div>
    <div class="g2">
      <div class="field">
        <label>조사일자</label>
        <div class="datewrap">
          <div class="date-disp ph" id="dateDisp">조사일자</div>
          <input type="date" id="surveyDate" onchange="syncDate();saveState()" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label>조사방식</label>
        <select class="inp filled" id="method" onchange="mark(this);saveState()">
          <option value="표본조사" selected>표본조사</option>
        </select>
      </div>
    </div>
    <div class="g3" style="margin-top:9px">
      <div class="field">
        <label>가입상품</label>
        <select class="inp filled" id="product" onchange="mark(this);refreshPrevUI();saveState()">
          <option value="normal" selected>적과전종합Ⅱ</option>
          <option value="five">5종한정특약</option>
        </select>
      </div>
      <div class="field">
        <label>적과전 사고</label>
        <select class="inp filled" id="prevAcc" onchange="mark(this);refreshPrevUI();saveState()">
          <option value="n" selected>없음</option>
          <option value="y">있음</option>
        </select>
      </div>
      <div class="field" id="disasterWrap">
        <label>재해종류</label>
        <select class="inp" id="disaster" onchange="mark(this);updatePrev();saveState()">
          <option value="">선택</option>
          <option value="태풍">태풍(강풍)</option>
          <option value="우박">우박</option>
          <option value="호우">집중호우</option>
          <option value="지진">지진</option>
          <option value="냉동">냉해·동상해</option>
          <option value="가뭄">가뭄·폭염</option>
          <option value="기타">기타 자연재해</option>
          <option value="조수">조수해</option>
          <option value="화재">화재</option>
        </select>
      </div>
    </div>
    <div class="g3" style="margin-top:9px">
      <div class="field">
        <label>평년착과수 <span class="unit">(개)</span></label>
        <input class="inp" id="avgCnt" type="text" inputmode="numeric" oninput="onComma(this);updatePrev();saveState()">
      </div>
      <div class="field">
        <label>착과율 <span class="unit">(%)</span></label>
        <input class="auto" id="autoSetRate" type="text" readonly value="-">
      </div>
      <div class="field">
        <label>전차 인정피해율 <span class="unit">(%)</span></label>

<!-- 갤러리 저장용 캡처 템플릿 -->

<div class="toast" id="toast"></div>

<script>
var KEY_STATE='sunburn_state', KEY_HIST='sunburn_history', KEY_BIG='sunburn_bigtext';
var FIELDS=['crop','farmNo','surveyDate','method','afterCnt','avgCnt','product','prevAcc','disaster','prevManual','joinTree','realTree','harvestDone','harvestImposs','deadTree','deadNC','aliveNC','sampleN','g0','g50','g80','g100'];
var LAST=null;

function num(id){ var v=(document.getElementById(id).value||'').toString().replace(/,/g,''); var n=parseFloat(v); return isNaN(n)?0:n; }
function mark(el){ if(el&&el.classList) el.classList.toggle('filled', el.value!==''&&el.value!=='0'); }
function onComma(el){ var v=el.value.replace(/[^0-9]/g,''); el.value=v?parseInt(v,10).toLocaleString('en-US'):''; mark(el); }
function fmt(n){ return (Math.round(n)).toLocaleString('en-US'); }
function fmt1(n){ return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:4}); }
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function showToast(m){ var t=document.getElementById('toast'); t.innerHTML=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2000); }

function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function syncDate(){
  var inp=document.getElementById('surveyDate'), disp=document.getElementById('dateDisp');
  if(inp.value){ var d=inp.value.split('-'); disp.textContent=d[0]+'.'+d[1]+'.'+d[2]; disp.classList.remove('ph'); disp.classList.add('filled'); }
  else { disp.textContent='조사일자'; disp.classList.add('ph'); disp.classList.remove('filled'); }
}

/* 표본조사 세로 표 — 표본번호 · 숙기/품종 · 표본낙과수 + 합계 */
function buildSampleRows(savedFall, savedVar){
  var n=parseInt(num('sampleN'))||0; if(n>30) n=30;
  var wrap=document.getElementById('sampRows');
  var prevF={}, prevV={};
  wrap.querySelectorAll('.samp-fall').forEach(function(i){ prevF[i.dataset.idx]=i.value; });
  wrap.querySelectorAll('.samp-sukgi').forEach(function(s){ var idx=s.dataset.idx; prevV[idx]=joinVar(s.value||'', readPumjong(idx)); });
  if(savedFall) prevF=savedFall;
  if(savedVar) prevV=savedVar;
  var rows='';
  for(var i=1;i<=n;i++){
    var f=(prevF[i]!==undefined)?prevF[i]:'';
    var v=(prevV[i]!==undefined)?String(prevV[i]):'';
    var sv=splitVar(v); var su=sv.su, pj=sv.pj;
    rows+='<tr>'+
      '<td class="samp-no">'+i+'</td>'+
      '<td><div class="samp-cell">'+
        '<select class="inp samp-sukgi'+(su!==''?' filled':'')+'" data-idx="'+i+'" onchange="mark(this);saveState()">'+
          '<option value=""'+(su===''?' selected':'')+'>숙기</option>'+
          '<option'+(su==='조생'?' selected':'')+'>조생</option>'+
          '<option'+(su==='중생'?' selected':'')+'>중생</option>'+
          '<option'+(su==='만생'?' selected':'')+'>만생</option>'+
        '</select>'+
        pumjongCell(i, pj)+
      '</div></td>'+
      '<td><input class="inp samp-fall'+(f!==''&&f!=='0'?' filled':'')+'" data-idx="'+i+'" type="number" inputmode="numeric" value="'+f+'" oninput="mark(this);sumSamples();saveState()"></td>'+
    '</tr>';
  }
  wrap.innerHTML=
    '<table class="samp-table"><colgroup><col style="width:40px"><col><col style="width:84px"></colgroup>'+
    '<thead><tr><th>표본</th><th>숙기/품종</th><th>표본낙과수</th></tr></thead>'+
    '<tbody>'+rows+
    '<tr class="samp-total-row"><td colspan="2" class="samp-total-label">합계 (개)</td>'+
    '<td><div class="samp-total-box" id="sampTotalBox">0</div></td></tr>'+
    '</tbody></table>';
  sumSamples();
}
function sumSamples(){
  var s=0; document.querySelectorAll('#sampRows .samp-fall').forEach(function(i){ s+=parseFloat((i.value||'').replace(/,/g,''))||0; });
  var box=document.getElementById('sampTotalBox'); if(box) box.textContent=fmt(s);
  return s;
}
function getSamples(){ var o={}; document.querySelectorAll('#sampRows .samp-fall').forEach(function(i){ o[i.dataset.idx]=i.value; }); return o; }

/* 품목별 품종 목록 (목록에 없으면 '직접입력' 선택 후 입력) */
var PUMJONG={
  '사과':['후지','홍로','쓰가루','감홍','양광','시나노골드','아리수','홍옥'],
  '배':['신고','원황','화산','추황배','황금배','만풍배','신화'],
  '단감':['부유','차랑','태추','서촌조생','로망'],
  '떫은감':['대봉','청도반시','둥시','상주둥시','갑주백목','고종시']
};
function cropList(){ var crop=(document.getElementById('crop')||{}).value||'사과'; return PUMJONG[crop]||[]; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* 품종 칸: 드롭다운(목록+직접입력) ↔ 직접입력 텍스트 토글 */
function pumjongCell(idx, pj){
  var list=cropList();
  var isCustom=(pj!=='' && list.indexOf(pj)<0);
  var sel='<select class="inp samp-pumjong-sel'+(pj!==''?' filled':'')+'" data-idx="'+idx+'" onchange="onPumjongSel(this)" style="'+(isCustom?'display:none':'')+'">'+
    '<option value=""'+(pj===''?' selected':'')+'>품종</option>'+
    list.map(function(v){ return '<option'+(v===pj?' selected':'')+'>'+v+'</option>'; }).join('')+
    '<option value="__custom__"'+(isCustom?' selected':'')+'>직접입력</option>'+
  '</select>';
  var txt='<input class="inp samp-pumjong-txt'+(isCustom?' filled':'')+'" data-idx="'+idx+'" type="text" placeholder="품종 입력" value="'+(isCustom?esc(pj):'')+'" style="'+(isCustom?'':'display:none')+'" oninput="mark(this);saveState()" onblur="onPumjongBlur(this)" autocomplete="off">';
  return '<span class="pj-wrap" data-idx="'+idx+'">'+sel+txt+'</span>';
}
function onPumjongSel(sel){
  var wrap=sel.parentNode, txt=wrap.querySelector('.samp-pumjong-txt');
  if(sel.value==='__custom__'){ sel.style.display='none'; txt.style.display=''; txt.value=''; mark(txt); txt.focus(); }
  else{ mark(sel); if(txt){ txt.style.display='none'; txt.value=''; mark(txt); } }
  saveState();
}
function onPumjongBlur(txt){
  if((txt.value||'').trim()===''){
    var wrap=txt.parentNode, sel=wrap.querySelector('.samp-pumjong-sel');
    txt.style.display='none'; if(sel){ sel.style.display=''; sel.value=''; mark(sel); }
    saveState();
  }
}
/* idx의 현재 품종 값 읽기 (텍스트 우선) */
function readPumjong(idx){
  var wrap=document.querySelector('#sampRows .pj-wrap[data-idx="'+idx+'"]'); if(!wrap) return '';
  var txt=wrap.querySelector('.samp-pumjong-txt'), sel=wrap.querySelector('.samp-pumjong-sel');
  if(txt && txt.style.display!=='none') return (txt.value||'').trim();
  if(sel) return (sel.value==='__custom__'?'':(sel.value||''));
  return '';
}
/* 숙기 + 품종 → "숙기/품종" 한 문자열 */
function joinVar(su, pj){ su=(su||'').trim(); pj=(pj||'').trim(); return (su&&pj)?(su+'/'+pj):(su||pj); }
function getVarieties(){ var o={};
  document.querySelectorAll('#sampRows .samp-sukgi').forEach(function(s){ var idx=s.dataset.idx; o[idx]=joinVar(s.value||'', readPumjong(idx)); });
  return o;
}
/* 저장된 "숙기/품종" 문자열을 분리 (옛 자유입력 호환) */
function splitVar(s){
  s=(s||'').trim(); var SU=['조생','중생','만생'];
  var i=s.indexOf('/');
  if(i>=0){ var a=s.slice(0,i).trim(), b=s.slice(i+1).trim(); if(SU.indexOf(a)>=0) return {su:a,pj:b}; return {su:'',pj:s}; }
  if(SU.indexOf(s)>=0) return {su:s,pj:''};
  return {su:'',pj:s};
}
/* 품목 변경 시 품종 목록 갱신 (값 보존하며 표 재생성) */
function updatePumjongList(){ buildSampleRows(); }

/* 전차 인정피해율(적과전 사고) 자동 산정 */
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function calcPrevRate(){
  if(val('prevAcc')!=='y') return {rate:0, setRate:null, note:''};
  var dis=val('disaster');
  if(!dis) return {rate:0, setRate:null, note:'재해종류를 선택하세요.'};
  // 조수해·화재는 적과종료 후 착과손해(추가감수량) 대상이 아님
  if(dis==='조수'||dis==='화재') return {rate:0, setRate:null, note:'조수해·화재는 착과손해(추가감수량) 대상이 아니라 전차 인정피해율 0%.'};

  if(val('product')==='normal'){
    // 보통약관 + 적과전 자연재해 → 착과손해 자동산정(착과율 기반)
    var avgCnt=num('avgCnt'), afterCnt=num('afterCnt');
    if(avgCnt<=0||afterCnt<=0) return {rate:0, setRate:null, note:'평년착과수·적과후착과수를 입력하면 자동 산정됩니다.'};
    var setRate=Math.round(afterCnt/avgCnt*10000)/10000;   // 착과율 (소수4자리)
    var dec;
    if(setRate>=1){ dec=0; }                               // 착과율 100%↑ → 착과손해 없음
    else if(setRate<0.6){ dec=0.05; }                      // 60% 미만 → 5%
    else { dec=Math.round(0.05*(1-setRate)/0.4*10000)/10000; } // 60%↑ → 5%×(100%−착과율)÷40%
    var nt = dec>0 ? '보통약관 적과전 자연재해 → 착과손해 자동산정.' : '착과율 100% 이상 → 착과손해 없음(0%).';
    return {rate:dec*100, setRate:setRate, note:nt};
  } else {
    // 5종 한정특약 → 추가감수량(착과손해) 미적용. 적과전 사고 인정피해율은 별도 조사(유과타박률·나무피해율·낙엽률) → 직접입력
    var m=parseFloat(val('prevManual'));
    if(!isNaN(m)&&m>0) return {rate:m, setRate:null, note:'5종 특약: 직접입력한 인정피해율 적용.'};
    return {rate:0, setRate:null, note:'5종 특약은 착과손해 미적용. 적과전 우박 등은 유과타박률·나무피해율 등 별도 조사값을 직접입력하세요.'};
  }
}
function updatePrev(){
  var r=calcPrevRate();
  var sr=document.getElementById('autoSetRate'), pr=document.getElementById('autoPrevRate');
  if(sr) sr.value=(r.setRate!==null)?(r.setRate*100).toFixed(2):'-';
  if(pr) pr.value=r.rate.toFixed(2);
}
function refreshPrevUI(){
  var acc=val('prevAcc')==='y';
  var ds=document.getElementById('disaster');
  if(ds){ ds.disabled=!acc; ds.style.opacity=acc?'1':'0.45'; if(!acc&&ds.value!==''){ ds.value=''; mark(ds); } }
  var mw=document.getElementById('manualWrap'); if(mw) mw.style.display=(acc&&val('product')==='five')?'flex':'none';
  updatePrev();
}

/* 합계·피해구성비율 실시간 갱신 */
function updateGrade(){
  var g0=num('g0'),g50=num('g50'),g80=num('g80'),g100=num('g100');
  var sum=g0+g50+g80+g100;
  var ratio=sum>0?(g50*0.5+g80*0.8+g100*1)/sum*100:0;
  var es=document.getElementById('autoGradeSum'); if(es) es.value=fmt(sum);
  var er=document.getElementById('autoDmgRatio'); if(er) er.value=ratio.toFixed(2);
}

/* 계산하기 전에도 나무조사 자동칸 실시간 반영 */
function liveUpdate(){
  updateGrade(); updatePrev();
  var afterCnt=num('afterCnt'), realTree=num('realTree');
  var harvestDone=num('harvestDone'), harvestImposs=num('harvestImposs'), deadTree=num('deadTree'), deadNC=num('deadNC'), aliveNC=num('aliveNC');
  var sampleN=num('sampleN'), fallSum=sumSamples();
  var g50=num('g50'),g80=num('g80'),g100=num('g100');
  var gradeSum=num('g0')+g50+g80+g100;
  var dmgRatio=gradeSum>0?(g50*0.5+g80*0.8+g100*1)/gradeSum*100:0;
  var prevRate=calcPrevRate().rate;
  var target=realTree-harvestDone-harvestImposs-deadTree-deadNC-aliveNC;
  var fd=document.getElementById('autoFallDmg'), ar=document.getElementById('autoAdmitRate'), ac=document.getElementById('autoAdmitCnt');
  var box=document.getElementById('resultBox'), mR=document.getElementById('mRate'), rH=document.getElementById('rbHero');
  if(afterCnt>0 && realTree>0 && sampleN>0 && target>0){
    var fallDamage=Math.round((fallSum/sampleN)*target);
    var covered=fallDamage>afterCnt*0.06;
    var admitRate=Math.max(0,dmgRatio-prevRate);
    var admitCnt=covered?Math.round(fallDamage*admitRate/100):0;
    if(fd) fd.value=fmt(fallDamage);
    if(ar) ar.value=admitRate.toFixed(2);
    if(ac) ac.value=fmt(admitCnt);
    /* 결과박스 실시간 표시 (계산하기 전에도) */
    var pctOfAfter=afterCnt>0?(admitCnt/afterCnt*100):0;
    if(mR) mR.textContent=pctOfAfter.toFixed(2)+'%';
    if(rH) rH.innerHTML=fmt(admitCnt)+' <small>개</small>';
    if(box) box.classList.remove('pending');
  }else{
    if(fd) fd.value='-'; if(ar) ar.value='-'; if(ac) ac.value='-';
    if(mR) mR.textContent='- -';
    if(rH) rH.innerHTML='—';
    if(box) box.classList.add('pending');
  }
}

function saveState(){
  try{
    var st={samples:getSamples(),sampleVars:getVarieties()};
    FIELDS.forEach(function(id){ var el=document.getElementById(id); if(el) st[id]=el.value; });
    st.calcDone=document.getElementById('content').classList.contains('locked');
    localStorage.setItem(KEY_STATE, JSON.stringify(st));
  }catch(e){}
}
function restoreState(){
  var st=null; try{ st=JSON.parse(localStorage.getItem(KEY_STATE)||'null'); }catch(e){}
  if(!st) return false;
  FIELDS.forEach(function(id){ var el=document.getElementById(id); if(el&&st[id]!==undefined) el.value=st[id]; });
  buildSampleRows(st.samples||null, st.sampleVars||null);
  syncDate();
  document.querySelectorAll('.inp').forEach(mark);
  updateGrade();
  refreshPrevUI();
  liveUpdate();
  if(st.calcDone){ calc(true); }
  return true;
}

function toggleBigText(){
  var on=document.body.classList.toggle('big-text');
  document.getElementById('bigtextBtn').classList.toggle('on',on);
  document.getElementById('bigtextLabel').textContent=on?'작게':'크게';
  try{ localStorage.setItem(KEY_BIG,on?'1':'0'); }catch(e){}
}

function openReset(){ document.getElementById('resetOverlay').classList.add('show'); }
function closeReset(){ document.getElementById('resetOverlay').classList.remove('show'); }
function doReset(){
  try{ localStorage.removeItem(KEY_STATE); }catch(e){}
  FIELDS.forEach(function(id){ var el=document.getElementById(id); if(!el) return;
    if(['harvestDone','harvestImposs','deadTree','deadNC','aliveNC','g0','g50','g80','g100'].indexOf(id)>=0) el.value='0';
    else if(id==='sampleN') el.value='3'; else if(id==='crop') el.value='사과'; else if(id==='method') el.value='표본조사'; else if(id==='product') el.value='normal'; else if(id==='prevAcc') el.value='n';
    else if(id==='surveyDate') el.value=todayStr();
    else el.value=''; });
  /* 착과수·주수 칸 확실히 비우기 (콤마/포맷 잔여 방지) */
  ['avgCnt','afterCnt','joinTree','realTree','prevManual'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  buildSampleRows({},{}); syncDate();
  document.getElementById('autoSetRate').value='-';
  document.getElementById('autoPrevRate').value='0.00';
  refreshPrevUI();
  document.querySelectorAll('.inp').forEach(mark);
  document.getElementById('autoFallDmg').value='-';
  document.getElementById('autoAdmitRate').value='-';
  document.getElementById('autoAdmitCnt').value='-';
  updateGrade();
  edit();
  document.getElementById('resultBox').className='result-box pending';
  document.getElementById('rbHero').textContent='—';
  document.getElementById('mRate').textContent='- -';
  document.getElementById('saveBtn').disabled=true; LAST=null;
  closeReset(); showToast('초기화 완료');
}

function getHistory(){ try{ return JSON.parse(localStorage.getItem(KEY_HIST)||'[]'); }catch(e){ return []; } }
function saveToHistory(res){
  var recs=getHistory();
  recs.unshift({ ts:Date.now(), farmNo:document.getElementById('farmNo').value||'', date:document.getElementById('surveyDate').value||'',
    admitCnt:res.admitCnt, admitRate:res.admitRate, state:localStorage.getItem(KEY_STATE) });
  if(recs.length>30) recs=recs.slice(0,30);
  try{ localStorage.setItem(KEY_HIST, JSON.stringify(recs)); }catch(e){}
}
function openHistory(){
  var recs=getHistory(), wrap=document.getElementById('historyList');
  if(!recs.length){ wrap.innerHTML='<p style="text-align:center;color:#aaa;font-size:13px;padding:18px 0">저장된 기록이 없습니다</p>'; }
  else{
    wrap.innerHTML=recs.map(function(r,i){
      var d=r.date?r.date.replace(/-/g,'.'):'날짜 미입력';
      return '<div class="hist-item" onclick="loadHistory('+i+')">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
        '<span style="font-size:15px;font-weight:800;color:var(--blue)">'+(r.farmNo?'농지 '+r.farmNo:'농지번호 미입력')+'</span>'+
        '<button onclick="event.stopPropagation();delHistory('+i+')" style="height:26px;padding:0 10px;border:1px solid #ffb3b3;border-radius:6px;background:#fff;color:#e24b4a;font-size:11px;font-weight:700;cursor:pointer">삭제</button></div>'+
        '<div style="font-size:11px;color:#888">'+d+' · 인정피해율 '+r.admitRate+'% · 인정과실수 '+fmt(r.admitCnt)+'개</div></div>';
    }).join('');
  }
  document.getElementById('historyOverlay').classList.add('show');
}
function closeHistory(){ document.getElementById('historyOverlay').classList.remove('show'); }
function loadHistory(i){
  var r=getHistory()[i]; if(!r||!r.state) return;
  try{ localStorage.setItem(KEY_STATE, r.state); }catch(e){}
  restoreState(); closeHistory(); edit();
  document.getElementById('saveBtn').disabled=true; LAST=null;
  showToast('불러왔습니다');
}
function delHistory(i){
  var recs=getHistory(); recs.splice(i,1);
  try{ localStorage.setItem(KEY_HIST, JSON.stringify(recs)); }catch(e){}
  openHistory();
}

/* 계산 */
function calc(silent){
  var afterCnt=num('afterCnt'), joinTree=num('joinTree'), realTree=num('realTree');
  var prevRate=calcPrevRate().rate;
  var harvestDone=num('harvestDone'), harvestImposs=num('harvestImposs'), deadTree=num('deadTree'), deadNC=num('deadNC'), aliveNC=num('aliveNC');
  var sampleN=num('sampleN'), fallSum=sumSamples();
  var g0=num('g0'),g50=num('g50'),g80=num('g80'),g100=num('g100');

  if(afterCnt<=0){ if(!silent) showToast('적과후착과수를 입력하세요'); return; }
  if(realTree<=0){ if(!silent) showToast('실제결과주수를 입력하세요'); return; }
  if(sampleN<=0){ if(!silent) showToast('표본주수를 입력하세요'); return; }

  var target=realTree-harvestDone-harvestImposs-deadTree-deadNC-aliveNC;
  if(target<=0){ if(!silent) showToast('조사대상주수가 0 이하입니다'); return; }

  var perTreeCnt=afterCnt/target;
  var perTreeFall=fallSum/sampleN;
  var fallDamage=Math.round(perTreeFall*target);
  var gradeSum=g0+g50+g80+g100;
  var dmgRatio=gradeSum>0?(g50*0.5+g80*0.8+g100*1)/gradeSum*100:0;
  var sixPct=afterCnt*0.06;
  var covered=fallDamage>sixPct;
  var admitRate=Math.max(0,dmgRatio-prevRate);
  var admitCnt=covered?Math.round(fallDamage*admitRate/100):0;

  LAST={ afterCnt:afterCnt, joinTree:joinTree, realTree:realTree, target:target, perTreeCnt:perTreeCnt,
    sampleN:sampleN, fallSum:fallSum, perTreeFall:perTreeFall, fallDamage:fallDamage, dmgRatio:dmgRatio,
    sixPct:sixPct, covered:covered, prevRate:prevRate, admitRate:admitRate, admitCnt:admitCnt };

  var box=document.getElementById('resultBox');
  box.classList.remove('pending');
  var pctOfAfter=afterCnt>0?(admitCnt/afterCnt*100):0;
  if(covered){
    document.getElementById('rbHero').innerHTML=fmt(admitCnt)+' <small>개</small>';
  }else{
    document.getElementById('rbHero').innerHTML='0 <small>개</small>';
  }
  document.getElementById('mRate').textContent=pctOfAfter.toFixed(2)+'%';

  /* 나무조사 3행 자동칸 + 피해구성 합계/비율 */
  document.getElementById('autoFallDmg').value=fmt(fallDamage);
  document.getElementById('autoAdmitRate').value=admitRate.toFixed(2);
  document.getElementById('autoAdmitCnt').value=fmt(admitCnt);
  updateGrade();

  document.getElementById('saveBtn').disabled=false;

  document.getElementById('content').classList.add('locked');
  document.getElementById('btnCalc').classList.remove('active');
  document.getElementById('btnEdit').classList.add('active');
  if(!silent){
    saveState(); saveToHistory({admitCnt:admitCnt, admitRate:admitRate.toFixed(2)});
    vibrate(15);
    document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function edit(){
  document.getElementById('content').classList.remove('locked');
  document.getElementById('btnCalc').classList.add('active');
  document.getElementById('btnEdit').classList.remove('active');
  saveState();
}

  var foot=multi?'<div style="font-size:9.5px;color:#888;margin-top:2px;line-height:1.45">※ 품종 2종 이상: 금차품종별착과수·품종별낙과수는 표본주수 비율 안분 추정치이며, 피해구성비율은 전체 1세트 기준입니다.</div>':'';

  return '<div style="width:430px;background:#f3f4f6;font-family:-apple-system,Noto Sans KR,sans-serif">'+
    '<div style="background:linear-gradient(180deg,#1f3b63 0%,#2f80ed 12%,#f3f4f6 12%,#f3f4f6 100%);padding:0 16px 22px;box-sizing:border-box">'+
      '<div style="height:24px"></div>'+
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;color:#fff;margin-bottom:14px">'+
        '<div style="font-size:16px;font-weight:800">☀️ '+crop+' 일소피해 계산결과</div>'+
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">'+
          '<span style="font-size:14px;font-weight:800;color:#fff">조사일자 '+date+'</span>'+
          '<span style="font-size:14px;font-weight:800;color:#fff">농지번호 '+farmNo+'</span></div></div>'+
      '<div style="display:flex;flex-direction:column;gap:12px">'+headLine+c1+c2+c3+c4+foot+'</div>'+
    '</div></div>';
}
function saveImage(){
  if(!LAST){ showToast('먼저 계산하세요'); return; }
  if(typeof html2canvas==='undefined'){ showToast('이미지 모듈을 불러오지 못했습니다<br>(최초 1회는 온라인 필요)'); return; }
  var box=document.getElementById('captureBox');
  box.innerHTML=buildCapture();
  showToast('이미지 만드는 중…');
  html2canvas(box,{scale:2,backgroundColor:'#f3f4f6',useCORS:true,windowWidth:430}).then(function(canvas){
    box.innerHTML='';
    var farmNo=(document.getElementById('farmNo').value||'농지').replace(/[^0-9]/g,'')||'농지';
    var crop=document.getElementById('crop').value||'사과';
    var d=new Date(), stamp=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'_'+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2);
    var link=document.createElement('a');
    link.download=crop+'_일소피해_'+farmNo+'_'+stamp+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    document.getElementById('saveDoneOverlay').classList.add('show');
  }).catch(function(){ box.innerHTML=''; showToast('저장에 실패했습니다'); });
}

  if(!restoreState()){
    document.getElementById('afterCnt').value='19,360';

    document.getElementById('deadNC').value='4';
    document.getElementById('aliveNC').value='2';

    buildSampleRows({1:'5',2:'5',3:'10'}, null);
    document.querySelectorAll('.inp').forEach(mark);
  }
  /* 조사일자는 항상 오늘 날짜로 (마늘 참고) */
  document.getElementById('surveyDate').value=todayStr();
  syncDate();
  /* 품목 기본값(사과) 완료색 보장 */
  mark(document.getElementById('crop'));
  updatePumjongList();
  updateGrade();
  refreshPrevUI();
  liveUpdate();
  document.getElementById('content').addEventListener('input',function(){
    if(!document.getElementById('content').classList.contains('locked')) liveUpdate();
  },{passive:true});
})();
</script>
