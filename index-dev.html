<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>손해평가 피해율계산기 (개발)</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --blue:#185FA5;--blue2:#378ADD;
  --border:#D8D6CE;--text:#1a1a1a;--sub:#666;--hint:#aaa;
  --bg:#F5F4F0;--card:#fff;--green:#1D9E75;--amber:#C2410C;
  --r:12px;--rs:8px;--nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
.header{background:var(--blue);color:white;padding:16px 16px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-icon{width:32px;height:32px;background:rgba(255,255,255,0.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header h1{font-size:17px;font-weight:700;flex:1}
.header-sub{font-size:11px;opacity:0.7;margin-top:2px}
.dev-badge{height:24px;padding:0 10px;background:rgba(255,200,0,0.25);border:1px solid rgba(255,200,0,0.5);border-radius:8px;color:#FFE082;font-size:11px;font-weight:700;display:flex;align-items:center;flex-shrink:0}
.crop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 14px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;align-content:start}
.crop-card{background:var(--card);border-radius:var(--r);padding:6px 6px;text-align:center;border:0.5px solid var(--border);cursor:pointer;position:relative;transition:transform 0.1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-sizing:border-box;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.crop-card:active{transform:scale(0.97)}
.crop-card.done{border-color:var(--green)}
.crop-card.test{border-color:var(--amber)}
.crop-icon{font-size:21px;margin-bottom:4px;line-height:1.05;white-space:nowrap;letter-spacing:1px}
.crop-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;letter-spacing:-0.02em}
.crop-desc{font-size:10.5px;color:var(--sub);font-weight:500}

/* ── 하단 네비게이션 (메인 index.html과 동일) ── */
.bottom-nav{flex-shrink:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:0.5px solid rgba(0,0,0,0.08);box-shadow:0 -2px 12px rgba(0,0,0,0.06);display:flex;align-items:stretch;z-index:200}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;color:#bbb;font-size:10px;font-weight:700;letter-spacing:-0.02em;padding:6px 0 4px;border-radius:12px}
.nav-item:active{opacity:.6;transform:scale(.93)}
.nav-item.on{color:var(--blue)}
.nav-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;transition:background .15s,transform .15s}
.nav-item.on .nav-icon{background:linear-gradient(135deg,#185FA5,#378ADD);box-shadow:0 3px 10px rgba(24,95,165,0.28);transform:translateY(-2px)}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🌿</div>
  <div style="flex:1">
    <h1>피해율계산기 개발버전</h1>
    <div class="header-sub">새 작물 테스트 전용</div>
  </div>
  <div class="dev-badge">DEV</div>
</div>

<div class="crop-grid">
  <div class="crop-card done" onclick="go('ginseng')">
    <div class="crop-icon"><svg viewBox="0 0 24 24" width="30" height="30" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle"><path d="M12 6.6 V8.4" stroke="#4E8A3D" stroke-width="1" stroke-linecap="round"/><path d="M12 6.2 C11 4.6 9.4 4.2 8.3 4.6 C9 6.2 10.4 6.8 12 6.5 Z" fill="#5AA046"/><path d="M12 6.2 C13 4.6 14.6 4.2 15.7 4.6 C15 6.2 13.6 6.8 12 6.5 Z" fill="#4E8A3D"/><path d="M12 7.6 C14 7.9 15.1 9.8 14.4 12.2 C13.9 14.1 14.9 16.8 14.1 19.1 C13.8 20.1 13.5 20.8 13.3 21.6 C13 20.5 12.7 18.6 12.3 17 C11.9 18.6 11.6 20.5 11.3 21.6 C11.1 20.8 10.8 20.1 10.5 19.1 C9.7 16.8 10.7 14.1 10.2 12.2 C9.5 9.8 10.6 7.9 12 7.6 Z" fill="#E8D6A8" stroke="#A98C53" stroke-width="1" stroke-linejoin="round"/><path d="M14.3 11.6 C15.6 11.2 16.6 10.4 17.2 9.4" fill="none" stroke="#A98C53" stroke-width="0.8" stroke-linecap="round"/><path d="M9.7 11.6 C8.4 11.2 7.4 10.4 6.8 9.4" fill="none" stroke="#A98C53" stroke-width="0.8" stroke-linecap="round"/><path d="M13.9 15.8 C15 15.8 15.8 15.2 16.3 14.4" fill="none" stroke="#A98C53" stroke-width="0.7" stroke-linecap="round"/><path d="M10.8 9.8 C11.6 10.2 12.4 10.2 13.2 9.8" fill="none" stroke="#BBA068" stroke-width="0.6" stroke-linecap="round"/><path d="M10.6 11.4 C11.5 11.8 12.5 11.8 13.4 11.4" fill="none" stroke="#BBA068" stroke-width="0.6" stroke-linecap="round"/></svg></div>
    <div class="crop-name">인삼</div>
    <div class="crop-desc">수확량조사</div>
  </div>


  <div class="crop-card done" onclick="go('broccoli')">
    <div class="crop-icon">🥦</div>
    <div class="crop-name">브로콜리</div>
    <div class="crop-desc">생산비 조사</div>
  </div>

  <div class="crop-card test" onclick="go('buckwheat')">
    <div class="crop-icon">🌾</div>
    <div class="crop-name">메밀</div>
    <div class="crop-desc">생산비 조사</div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='./cover_card.html'"><div class="nav-icon">📋</div><span>표지카드</span></button>
  <button class="nav-item" onclick="location.href='./location.html'"><div class="nav-icon">📍</div><span>위치</span></button>
  <button class="nav-item" onclick="location.href='./area.html'"><div class="nav-icon">📐</div><span>면적측정</span></button>
  <button class="nav-item on"><div class="nav-icon" style="padding:0;"><img src="./icon-192.png" style="width:100%;height:100%;object-fit:contain;" alt=""></div><span>계산기</span></button>
  <button class="nav-item" onclick="location.href='./help.html'"><div class="nav-icon">💡</div><span>도움말</span></button>
</nav>

<script>
function go(page){
  if(page==='ginseng')     location.href='./ginseng.html';
  if(page==='broccoli')    location.href='./broccoli.html';
  if(page==='buckwheat')   location.href='./buckwheat.html';
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));
  caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
}
</script>
</body>
</html>
