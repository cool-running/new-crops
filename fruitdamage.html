<script>
function bindMobileFocusHandlers(){
  var selectors='input.inp, select.inp, input[type=number], input[type=text], .grade-cell input';
  document.querySelectorAll(selectors).forEach(function(el){
    if(el.dataset.mobileFocusBound==='1') return;
    if(el.readOnly) return;
    el.dataset.mobileFocusBound='1';
    el.addEventListener('focus',function(){ try{el.select();}catch(_){} },{passive:true});
    var isSelect=el.tagName==='SELECT';
    var isDate=el.type==='date';
    if(!isSelect && !isDate){
      el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    }
    if(!isSelect && !isDate){
      var _tsx=0,_tsy=0,_scrolling=false;
      el.addEventListener('touchstart',function(e){ _tsx=e.touches[0].clientX; _tsy=e.touches[0].clientY; _scrolling=false; },{passive:true});
      el.addEventListener('touchmove',function(e){ if(Math.abs(e.touches[0].clientX-_tsx)>6||Math.abs(e.touches[0].clientY-_tsy)>6) _scrolling=true; },{passive:true});
      el.addEventListener('touchend',function(e){
        if(_scrolling) return;
        if(e.cancelable) e.preventDefault();
        el.focus();
        setTimeout(function(){ try{ el.select(); }catch(_){ try{ el.setSelectionRange(0,(el.value||'').length); }catch(__){} } },50);
      },{passive:false});
    }
  });
}
document.addEventListener('DOMContentLoaded',function(){
  bindMobileFocusHandlers();
  document.addEventListener('click',function(){ setTimeout(bindMobileFocusHandlers,0); },{passive:true});
});
</script>
<style>
:root{
  --blue:#185FA5;--blue2:#378ADD;
  --auto:#F3F1EA;--border:#D8D6CE;--binp:#378ADD;
  --text:#1a1a1a;--sub:#666;--hint:#aaa;
  --bg:#F5F4F0;--card:#fff;
  --red:#e24b4a;--green:#1D9E75;--amber:#C2410C;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-user-select:none;user-select:none;padding-bottom:env(safe-area-inset-bottom,30px)}
.header{background:var(--blue);color:white;padding:13px 14px 11px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.back-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,0.15);border-radius:8px;cursor:pointer;flex-shrink:0;color:#fff;text-decoration:none}
.header-icon{width:30px;height:30px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.header h1{font-size:16px;font-weight:700;flex:1}
.header-sub{font-size:10.5px;opacity:0.72;margin-top:1px}
.hdr-state{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,0.92);border:1px solid rgba(255,255,255,0.6);white-space:nowrap;transition:all .15s}
.hdr-state.unlocked{color:#137a4d}
.hdr-state.locked{color:#c0392b}
.legend{display:flex;gap:12px;padding:8px 16px;background:var(--card);border-bottom:0.5px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.dot-inp{width:10px;height:10px;border-radius:2px;background:white;border:1.5px solid var(--binp)}
.dot-filled{width:10px;height:10px;border-radius:2px;background:#e8faf3;border:1.5px solid var(--green)}
.dot-auto{width:10px;height:10px;border-radius:2px;background:var(--auto);border:0.5px solid var(--border)}

.content{padding:12px 14px 40px}
.section{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 13px 13px;margin-bottom:11px}
.btn-add{height:28px;padding:0 12px;border:1.5px solid var(--blue);border-radius:6px;background:#ebf4ff;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-icon{width:30px;height:28px;padding:0;border:1.5px solid var(--blue);border-radius:6px;background:#ebf4ff;color:var(--blue);font-size:15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-icon.minus{border-color:var(--border);background:#fff;color:var(--sub)}
.btn-icon.sub{border-color:var(--green);background:#e8faf3;color:var(--green)}
.btn-icon.sub.minus{border-color:var(--border);background:#fff;color:var(--sub)}
.sec-title{font-size:13px;font-weight:800;color:var(--text);letter-spacing:-0.01em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.subhead{font-size:11px;font-weight:800;color:var(--blue);margin:0 0 8px;letter-spacing:-0.01em}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;align-items:end}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.field{display:flex;flex-direction:column;gap:4px;position:relative}
.field label{font-size:11px;color:var(--sub);font-weight:600;line-height:1.25}
.field .unit{font-size:10px;color:var(--hint);font-weight:500}
input.inp,select.inp{height:40px;border:1.5px solid var(--binp);border-radius:var(--rs);padding:0 8px;font-size:13px;font-weight:700;background:white;color:var(--text);width:100%;text-align:center;transition:background .15s,border-color .15s;-webkit-appearance:none;appearance:none}
select.inp{text-align:left;-webkit-appearance:auto;appearance:auto}
input.inp:focus,select.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,0.18);background:#dceeff;color:var(--blue)}
input.inp.filled{background:#e8faf3;border-color:var(--green);color:#0d5c35}
input.inp.filled:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,0.18);background:#dceeff;color:var(--blue)}
input.inp::placeholder{color:var(--hint);font-weight:500;opacity:1}
input.auto{height:40px;border:1.5px solid var(--border);border-radius:var(--rs);padding:0 8px;font-size:13px;font-weight:700;background:var(--auto);color:var(--text);width:100%;text-align:center;-webkit-appearance:none}
.hint{font-size:10.5px;color:var(--hint);margin-top:7px;line-height:1.5}

.datewrap{position:relative}
.datewrap input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.date-disp{height:40px;border:1.5px solid var(--binp);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:#fff;color:var(--text)}
.date-disp.ph{color:var(--hint);font-weight:500}
.date-disp.filled{background:#e8faf3;border-color:var(--green);color:#0d5c35}

.bigtext-btn{height:34px;padding:0 12px;background:transparent;border:1.5px solid var(--blue2);border-radius:var(--rs);color:var(--blue2);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.bigtext-btn.on{background:var(--blue2);color:#fff;box-shadow:0 2px 8px rgba(55,138,221,0.35)}
.reset-btn{height:34px;padding:0 14px;background:transparent;border:1.5px solid var(--red);border-radius:var(--rs);color:var(--red);font-size:13px;font-weight:600;cursor:pointer}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg-btn{height:40px;border:1.5px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s}
.seg-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(24,95,165,0.28)}

.module-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.module-body{margin-top:10px}
.module-body.disabled{display:none}

.grade-block{border-top:1px dashed var(--border);padding-top:12px;margin-top:12px}
.grade-block:first-child{border-top:none;padding-top:0;margin-top:0}
.grade-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.grade-cell label{font-size:10px;text-align:center;display:block;height:13px;line-height:13px;margin-bottom:3px;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden}
.grade-cell input{height:38px;font-size:13px;padding:0 2px;text-align:center;width:100%}

.calc-action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.btn-calc{height:48px;border:none;border-radius:12px;background:var(--blue);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-calc.active{background:linear-gradient(135deg,#185FA5 0%,#2478cc 100%);box-shadow:0 4px 14px rgba(24,95,165,0.35)}
.btn-edit{height:48px;border:2px solid var(--green);border-radius:12px;background:white;color:var(--green);font-size:15px;font-weight:700;cursor:pointer}
.btn-edit.active{background:var(--green);color:white;box-shadow:0 4px 14px rgba(29,158,117,0.3)}
.locked .section input.inp:not([type=date]),.locked .section select.inp,.locked .seg-btn,.locked .btn-add,.locked .btn-icon{pointer-events:none;opacity:0.78}

.result-box{background:linear-gradient(135deg,#6b7280 0%,#8a929d 100%);border-radius:18px;padding:16px 16px 14px;margin-bottom:10px;color:white;box-shadow:0 8px 28px rgba(90,98,110,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}
.result-box.pending{background:linear-gradient(135deg,#9a9a9a 0%,#bbb 100%);box-shadow:none}
.save-btn{height:36px;padding:0 10px;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);color:#fff;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;flex-shrink:0}
.save-btn:disabled{opacity:0.45;cursor:default}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:18px 16px;width:100%;max-width:340px;max-height:80vh;display:flex;flex-direction:column}
.modal h3{font-size:17px;font-weight:800;text-align:center;margin-bottom:6px;color:#333}
.hist-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:0.95}
.save-modal{background:#fff;border-radius:16px;padding:24px 20px;text-align:center;width:260px}
.save-modal p{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text)}
.save-modal .btn-ok{width:100%;height:44px;background:var(--blue);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer}

body.big-text input.inp,body.big-text select.inp{height:50px !important;font-size:18px !important;font-weight:700 !important;border-width:2px !important}
body.big-text .date-disp{height:50px !important;font-size:16px !important;font-weight:800 !important}
body.big-text .field label{font-size:13px !important}
body.big-text .grade-cell input{height:44px !important;font-size:14px !important}
body.big-text .seg-btn{height:46px !important;font-size:14px !important}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="./index.html">‹</a>
  <div class="header-icon">🍏</div>
  <div style="flex:1">
    <h1>착과·낙과피해율 계산기</h1>
    <div class="header-sub">과수4종 · 착과피해·낙과피해조사</div>
  </div>
  <div class="hdr-state unlocked" id="hdrState">🔓 수정 중</div>
</div>

<div class="legend">
  <div class="legend-item"><span class="dot-inp"></span>직접입력</div>
  <div class="legend-item"><span class="dot-filled"></span>입력완료</div>
  <div class="legend-item"><span class="dot-auto"></span>자동계산</div>
</div>

<div class="content" id="content">

  <!-- 상단바 -->
  <div class="section">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px">

    </div>
    <div style="display:flex;gap:6px;align-items:flex-end">
      <div class="field" style="flex:0 0 27%;min-width:0">
        <label>계약자명</label>
        <input type="text" id="contractorName" class="inp" placeholder="이름" oninput="mark(this);saveState()" autocomplete="off">
      </div>
      <div class="field" style="flex:0 0 20%;min-width:0">
        <label>농지번호</label>
        <input type="text" id="farmNo" class="inp" inputmode="numeric" placeholder="4자리" maxlength="4"
          oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4);mark(this);saveState()"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" autocomplete="off">
      </div>
      <div class="field" style="flex:1;min-width:0">
        <label>조사일자</label>
        <div class="datewrap">
          <div class="date-disp ph" id="dateDisp">조사일자</div>
          <input type="date" id="surveyDate" onchange="syncDate();saveState()" autocomplete="off">
        </div>
      </div>
      <div style="flex:0 0 40px">
        <button onclick="openHistory()" title="이전 기록 불러오기"
          style="width:100%;height:42px;border:1.5px solid var(--blue2);border-radius:var(--rs);background:white;color:var(--blue);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">📋</button>
      </div>
    </div>
  </div>

  <!-- 착과피해조사 -->
  <div class="section" id="attSection">
    <div class="module-head">
      <div class="sec-title" style="margin-bottom:0">🍎 착과피해조사</div>
      <div class="seg" style="grid-template-columns:1fr 1fr;width:150px">
        <button type="button" class="seg-btn" id="attOnBtn" onclick="setAttEnabled(true)">실시</button>
        <button type="button" class="seg-btn" id="attOffBtn" onclick="setAttEnabled(false)">미실시</button>
      </div>
    </div>
    <div class="module-body" id="attBody">
      <input type="hidden" id="attBlockN" value="1">
      <div class="field" style="margin-bottom:12px;max-width:38%">
        <label>품목</label>
        <select class="inp filled" id="cropAtt" onchange="mark(this);onAttCropChange();saveState()" style="text-align:center;text-align-last:center">
          <option value="사과" selected>사과</option>
          <option value="배">배</option>
          <option value="단감">단감</option>
          <option value="떫은감">떫은감</option>
        </select>
      </div>
      <div class="sec-title" style="justify-content:space-between">
        <span class="subhead" style="margin:0">📊 착과 피해구성조사</span>
        <span style="display:flex;gap:6px">
          <button type="button" class="btn-add" style="background:#fff;border-color:var(--border);color:var(--sub)" onclick="removeAttBlock()">－ 표본주 삭제</button>

    </div>
  </div>

  <!-- 낙과피해조사 -->

    <div class="module-head">

      <div class="seg" style="grid-template-columns:1fr 1fr;width:150px">
        <button type="button" class="seg-btn" id="fallOnBtn" onclick="setFallEnabled(true)">실시</button>
        <button type="button" class="seg-btn" id="fallOffBtn" onclick="setFallEnabled(false)">미실시</button>
      </div>
    </div>
    <div class="module-body" id="fallBody">
      <input type="hidden" id="fallBlockN" value="1">
      <div class="field" style="margin-bottom:12px;max-width:38%">
        <label>품목</label>
        <select class="inp filled" id="cropFall" onchange="mark(this);onFallCropChange();saveState()" style="text-align:center;text-align-last:center">
          <option value="사과" selected>사과</option>
          <option value="배">배</option>
          <option value="단감">단감</option>
          <option value="떫은감">떫은감</option>
        </select>
      </div>
      <div class="sec-title" style="justify-content:space-between">
        <span class="subhead" style="margin:0">📊 낙과 피해구성조사</span>
        <span style="display:flex;gap:6px">
          <button type="button" class="btn-add" style="background:#fff;border-color:var(--border);color:var(--sub)" onclick="removeFallBlock()">－ 표본주 삭제</button>
          <button type="button" class="btn-add" id="fallAddBtn" onclick="addFallBlock()">＋ 표본주 추가</button>
        </span>
      </div>
      <div id="fallGradeGroups"></div>
    </div>
  </div>

  <div class="calc-action-row">
    <button class="btn-edit" id="btnEdit" onclick="edit()">✏️ 수정하기</button>
    <button class="btn-calc active" id="btnCalc" onclick="calc()">🧮 계산하기</button>
  </div>

  <!-- 결과 -->
  <div class="result-box pending" id="resultBox" style="padding:0 12px">
    <div style="display:flex;align-items:center;padding:13px 0;gap:2px">
      <div id="resultDetail" style="display:flex;align-items:center;flex:1;min-width:0;gap:2px">
        <div style="padding:0 6px;flex:1;min-width:0;text-align:center">

      </div>
      <div style="width:1px;height:40px;background:rgba(255,255,255,0.28);flex-shrink:0;margin:0 4px" id="resultDivider"></div>
      <div style="flex-shrink:0">
        <button class="save-btn" id="saveBtn" onclick="saveImage()" disabled><span style="font-size:14px">📷</span><span>갤러리 저장</span></button>
      </div>
    </div>
  </div>

</div>

<!-- 이미지 저장 완료 -->

  <div class="save-modal">
    <div style="font-size:36px;margin-bottom:10px">📷</div>
    <p>이미지가 저장되었어요!</p>
    <button class="btn-ok" onclick="document.getElementById('saveDoneOverlay').classList.remove('show')">확인</button>
  </div>
</div>

<!-- 초기화 -->
<div class="overlay" id="resetOverlay">
  <div class="modal">
    <h3>전체 초기화</h3>
    <p style="text-align:center;color:#666;font-size:13px;margin:8px 0 16px">입력한 모든 값이 지워집니다.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button onclick="closeReset()" style="height:44px;border:1.5px solid #ddd;border-radius:10px;background:#f5f5f5;color:#666;font-weight:700;cursor:pointer">취소</button>
      <button onclick="doReset()" style="height:44px;border:none;border-radius:10px;background:var(--red);color:#fff;font-weight:700;cursor:pointer">초기화</button>
    </div>
  </div>
</div>

<!-- 이전기록 -->
<div class="overlay" id="historyOverlay">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">이전 기록</h3>
      <button onclick="closeHistory()" style="border:none;background:none;font-size:22px;color:#aaa;cursor:pointer">✕</button>
    </div>
    <div id="historyList" style="overflow-y:auto"></div>
  </div>
</div>

<script>
var KEY_STATE='fruitdamage_state', KEY_HIST='fruitdamage_history', KEY_BIG='fruitdamage_bigtext';
var FIELDS=['cropAtt','cropFall','contractorName','farmNo','surveyDate','attBlockN','fallBlockN'];
var LAST=null;
var attEnabled=false, fallEnabled=false;
var MINBLK=1, MAXBLK=20;

function num(id){ var e=document.getElementById(id); if(!e) return 0; var v=(e.value||'').toString().replace(/,/g,''); var n=parseFloat(v); return isNaN(n)?0:n; }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function mark(el){ if(el&&el.classList) el.classList.toggle('filled', el.value!==''&&el.value!=='0'); }
function onComma(el){ var v=el.value.replace(/[^0-9]/g,''); el.value=v?parseInt(v,10).toLocaleString('en-US'):''; mark(el); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ── 품목/품종 ── */
var PUMJONG={
  '사과':['부사(후지)','홍로','쓰가루','아오리','감홍','양광','시나노골드','아리수','홍옥','미얀비'],
  '배':['신고','원황','화산','추황배','황금배','만풍배','신화'],
  '단감':['부유','차랑','태추','서촌조생','로망'],
  '떫은감':['대봉','청도반시','둥시','상주둥시','갑주백목','고종시']
};
function cropList(prefix){ return PUMJONG[val(prefix==='fall'?'cropFall':'cropAtt')]||[]; }
function onAttCropChange(){ buildAttBlocks(currentAttBlocks()); liveUpdate(); saveState(); }
function onFallCropChange(){ buildFallBlocks(currentFallBlocks()); liveUpdate(); saveState(); }
function pumjongCell(prefix,idx,pj,flexStyle){
  var list=cropList(prefix); var isCustom=(pj!==''&&list.indexOf(pj)<0);
  var sel='<select class="inp filled '+prefix+'-pj-sel" data-idx="'+idx+'" onchange="onPjSel(this)" style="'+(isCustom?'display:none':'')+'">'+
    '<option value=""'+(pj===''?' selected':'')+'>품종</option>'+
    list.map(function(v){ return '<option'+(v===pj?' selected':'')+'>'+v+'</option>'; }).join('')+
    '<option value="__custom__"'+(isCustom?' selected':'')+'>직접입력</option>'+
  '</select>';
  var txt='<input class="inp filled '+prefix+'-pj-txt" data-idx="'+idx+'" type="text" placeholder="품종 입력" value="'+(isCustom?esc(pj):'')+'" style="'+(isCustom?'':'display:none')+'" oninput="mark(this);saveState()" onblur="onPjBlur(this)" autocomplete="off">';
  return '<span class="pj-wrap" style="'+(flexStyle||'flex:1')+';display:block;min-width:0">'+sel+txt+'</span>';
}
function onPjSel(sel){
  var wrap=sel.parentNode, txt=wrap.querySelector('input');
  if(sel.value==='__custom__'){ sel.style.display='none'; txt.style.display=''; txt.value=''; mark(txt); txt.focus(); }
  else{ mark(sel); if(txt){ txt.style.display='none'; txt.value=''; mark(txt); } }
  liveUpdate(); saveState();
}
function onPjBlur(txt){
  if((txt.value||'').trim()===''){
    var wrap=txt.parentNode, sel=wrap.querySelector('select');
    txt.style.display='none'; if(sel){ sel.style.display=''; sel.value=''; mark(sel); }
  }
  liveUpdate(); saveState();
}
function readPj(prefix,block){
  var sel=block.querySelector('.'+prefix+'-pj-sel'), txt=block.querySelector('.'+prefix+'-pj-txt');
  if(txt && txt.style.display!=='none') return (txt.value||'').trim();
  if(sel) return (sel.value==='__custom__'?'':(sel.value||''));
  return '';
}
function fmt(n){ return (Math.round(n||0)).toLocaleString('en-US'); }
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function showToast(m){ var t=document.getElementById('toast'); t.innerHTML=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2000); }
function todayStr(){ var d=new Date(); var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day); }
function syncDate(){
  var inp=document.getElementById('surveyDate'), disp=document.getElementById('dateDisp');
  if(inp.value){ var d=inp.value.split('-'); disp.textContent=d[0]+'.'+d[1]+'.'+d[2]; disp.classList.remove('ph'); disp.classList.add('filled'); }
  else { disp.textContent='조사일자'; disp.classList.add('ph'); disp.classList.remove('filled'); }
}

/* ── 피해구성 셀 ── */
function gradeCell(label,cls,v,extraClass){
  v=(v!==undefined&&v!=='')?v:'0';
  return '<div class="grade-cell'+(extraClass?' '+extraClass:'')+'"><label>'+label+'</label><input class="inp '+cls+'" type="number" inputmode="numeric" value="'+v+'" oninput="mark(this);liveUpdate();saveState()"></div>';
}
function ratioOf5(v){ var s=v.g0+v.g30+v.g50+v.g80+v.g100; return s>0?(v.g30*0.3+v.g50*0.5+v.g80*0.8+v.g100*1)/s*100:0; }

/* ── 착과 블록 ── */
function buildAttBlocks(saved){
  var n=parseInt(num('attBlockN'))||1; if(n>MAXBLK) n=MAXBLK; if(n<MINBLK) n=MINBLK;
  var wrap=document.getElementById('attGradeGroups'); if(!wrap) return;
  var prev=saved || currentAttBlocks();
  var html='';
  for(var i=1;i<=n;i++){
    var v=prev[i]||{};
    html+='<div class="grade-block" data-idx="'+i+'">'+
      '<div class="grade-block-head">'+
        pumjongCell('att',i,v.pj||'','flex:0 0 42%')+
        '<div class="auto" id="attRatio_'+i+'" style="flex-shrink:0;margin-left:5px;width:66px;height:40px;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--blue)">0.00%</div>'+
        '<div class="auto" id="attSum_'+i+'" style="flex-shrink:0;margin-left:5px;width:72px;height:40px;font-size:13.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--sub)">합계 0개</div>'+
      '</div>'+
      '<div class="g5">'+
        gradeCell('정상','ag0',v.g0)+gradeCell('30%형','ag30',v.g30,'grade-30')+gradeCell('50%형','ag50',v.g50)+gradeCell('80%형','ag80',v.g80)+gradeCell('100%형','ag100',v.g100,'grade-100')+
      '</div>'+
    '</div>';
  }
  wrap.innerHTML=html;
  document.querySelectorAll('#attGradeGroups .inp').forEach(mark);
}
function currentAttBlocks(){
  var o={}; document.querySelectorAll('#attGradeGroups .grade-block').forEach(function(b){
    var idx=b.dataset.idx;
    o[idx]={ pj:readPj('att',b),
      g0:b.querySelector('.ag0').value, g30:b.querySelector('.ag30').value, g50:b.querySelector('.ag50').value, g80:b.querySelector('.ag80').value, g100:b.querySelector('.ag100').value };
  }); return o;
}
function addAttBlock(){ var n=parseInt(num('attBlockN'))||1; if(n>=MAXBLK){ showToast('최대 '+MAXBLK+'개까지 가능합니다'); return; } document.getElementById('attBlockN').value=n+1; buildAttBlocks(); liveUpdate(); saveState(); }
function removeAttBlock(){ var n=parseInt(num('attBlockN'))||1; if(n<=MINBLK){ showToast('최소 1개는 있어야 합니다'); return; } document.getElementById('attBlockN').value=n-1; buildAttBlocks(); liveUpdate(); saveState(); }

/* ── 낙과 블록 ── */
function buildFallBlocks(saved){
  var n=parseInt(num('fallBlockN'))||1; if(n>MAXBLK) n=MAXBLK; if(n<MINBLK) n=MINBLK;
  var wrap=document.getElementById('fallGradeGroups'); if(!wrap) return;
  var prev=saved || currentFallBlocks();
  var html='';
  for(var i=1;i<=n;i++){
    var v=prev[i]||{}; var mode=v.mode||'census';
    var sampArr = Array.isArray(v.samp) && v.samp.length ? v.samp : ['','',''];
    html+='<div class="grade-block" data-idx="'+i+'" data-mode="'+mode+'">'+
      '<div class="seg" style="margin-bottom:9px">'+
        '<button type="button" class="seg-btn fallModeBtn'+(mode==='sample'?' on':'')+'" onclick="setFallBlockMode(this,\'sample\')">표본조사</button>'+
        '<button type="button" class="seg-btn fallModeBtn'+(mode==='census'?' on':'')+'" onclick="setFallBlockMode(this,\'census\')">전수조사</button>'+
      '</div>'+
      '<div class="fallCensusWrap" style="display:'+(mode==='census'?'':'none')+'">'+
        '<div class="grade-block-head">'+
          '<div class="field" style="flex:0 0 42%"><label>낙과수 (개)</label><input class="inp filled fallCntInput" type="text" inputmode="numeric" placeholder="0" value="'+(v.cnt||'')+'" oninput="onComma(this);liveUpdate();saveState()"></div>'+
          '<div class="auto" id="fallRatio_'+i+'" style="flex-shrink:0;margin-left:5px;width:66px;height:40px;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--blue)">0.00%</div>'+
          '<div class="auto" id="fallSum_'+i+'" style="flex-shrink:0;margin-left:5px;width:72px;height:40px;font-size:13.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--sub)">합계 0개</div>'+
        '</div>'+
      '</div>'+
      '<div class="fallSampleWrap" style="display:'+(mode==='sample'?'':'none')+'">'+
        '<div class="grade-block-head" style="align-items:flex-end;margin-bottom:8px">'+
          pumjongCell('fall',i,v.pj||'','flex:0 0 52%')+
          '<div class="field" style="flex:1;margin-left:6px"><label>조사대상주수 (개)</label><input class="inp filled fallTargetInput" type="text" inputmode="numeric" placeholder="0" value="'+(v.target||'')+'" oninput="onComma(this);liveUpdate();saveState()"></div>'+
        '</div>'+
        '<div class="sec-title" style="justify-content:space-between;margin-bottom:6px">'+
          '<span class="subhead" style="margin:0">표본주별 낙과수 (개)</span>'+
          '<span style="display:flex;gap:6px">'+
            '<button type="button" class="btn-icon sub minus" onclick="removeFallSamp(this)">－</button>'+
            '<button type="button" class="btn-icon sub" onclick="addFallSamp(this)">＋</button>'+
          '</span>'+
        '</div>'+
        '<div class="g5" style="margin-bottom:6px">'+
          sampArr.map(function(sv,k){ return '<div class="grade-cell"><label>표본'+(k+1)+'</label><input class="inp fallSampSlot" type="number" inputmode="numeric" value="'+(sv||'')+'" oninput="mark(this);liveUpdate();saveState()"></div>'; }).join('')+
        '</div>'+
        '<div class="grade-block-head" style="margin-bottom:0">'+
          '<div class="hint" style="margin-top:0;flex:1">표본 평균 × 조사대상주수 = <b id="fallAutoCnt_'+i+'">0</b>개</div>'+
          '<div class="auto" id="fallRatioS_'+i+'" style="flex-shrink:0;margin-left:5px;width:66px;height:34px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--blue)">0.00%</div>'+
          '<div class="auto" id="fallSumS_'+i+'" style="flex-shrink:0;margin-left:5px;width:72px;height:34px;font-size:12.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--sub)">합계 0개</div>'+
        '</div>'+
      '</div>'+
      '<div class="g5" style="margin-top:10px">'+
        gradeCell('정상','fg0',v.g0)+gradeCell('30%형','fg30',v.g30,'grade-30')+gradeCell('50%형','fg50',v.g50)+gradeCell('80%형','fg80',v.g80)+gradeCell('100%형','fg100',v.g100,'grade-100')+
      '</div>'+
    '</div>';
  }
  wrap.innerHTML=html;
  document.querySelectorAll('#fallGradeGroups .inp').forEach(mark);
  var lastMode=(prev[n]||{}).mode||'census';
  var addBtn=document.getElementById('fallAddBtn');
  if(addBtn){ addBtn.style.opacity = lastMode==='census' ? '0.4' : '1'; }
}
var MINFSAMP=1, MAXFSAMP=10;
function addFallSamp(btn){
  var block=btn.closest('.grade-block'); if(!block) return;
  var slots=block.querySelectorAll('.fallSampSlot');
  if(slots.length>=MAXFSAMP){ showToast('표본은 최대 '+MAXFSAMP+'개까지 가능합니다'); return; }
  var saved=currentFallBlocks();
  saved[block.dataset.idx].samp.push('');
  buildFallBlocks(saved); liveUpdate(); saveState();
}
function removeFallSamp(btn){
  var block=btn.closest('.grade-block'); if(!block) return;
  var slots=block.querySelectorAll('.fallSampSlot');
  if(slots.length<=MINFSAMP){ showToast('최소 1개 표본은 있어야 합니다'); return; }
  var saved=currentFallBlocks();
  saved[block.dataset.idx].samp.pop();
  buildFallBlocks(saved); liveUpdate(); saveState();
}
function setFallBlockMode(btn,mode){
  var block=btn.closest('.grade-block'); if(!block) return;
  var savedAll=currentFallBlocks();
  savedAll[block.dataset.idx].mode=mode;
  buildFallBlocks(savedAll);
  liveUpdate(); saveState();
}
function currentFallBlocks(){
  var o={}; document.querySelectorAll('#fallGradeGroups .grade-block').forEach(function(b){
    var idx=b.dataset.idx;
    var samp=Array.prototype.map.call(b.querySelectorAll('.fallSampSlot'), function(el){ return el.value; });
    o[idx]={ pj:readPj('fall',b), mode:b.dataset.mode||'census', cnt:b.querySelector('.fallCntInput').value, target:b.querySelector('.fallTargetInput').value, samp:samp,
      g0:b.querySelector('.fg0').value, g30:b.querySelector('.fg30').value, g50:b.querySelector('.fg50').value, g80:b.querySelector('.fg80').value, g100:b.querySelector('.fg100').value };
  }); return o;
}
function addFallBlock(){
  var n=parseInt(num('fallBlockN'))||1; if(n>=MAXBLK){ showToast('최대 '+MAXBLK+'개까지 가능합니다'); return; }
  var saved=currentFallBlocks();
  var last=saved[n]||{};
  if((last.mode||'census')==='census'){ showToast('전수조사는 품종 구분 없이 전체 1건만 입력합니다. 여러 품종을 나눠 입력하려면 표본조사를 사용하세요.'); return; }
  document.getElementById('fallBlockN').value=n+1;
  saved[n+1]={ mode:last.mode||'census' };
  buildFallBlocks(saved); liveUpdate(); saveState();
}
function removeFallBlock(){ var n=parseInt(num('fallBlockN'))||1; if(n<=MINBLK){ showToast('최소 1개는 있어야 합니다'); return; } document.getElementById('fallBlockN').value=n-1; buildFallBlocks(); liveUpdate(); saveState(); }

/* ── 실시여부 ── */
function setAttEnabled(on){
  attEnabled=on;
  document.getElementById('attOnBtn').classList.toggle('on',on);
  document.getElementById('attOffBtn').classList.toggle('on',!on);
  document.getElementById('attBody').classList.toggle('disabled',!on);
  liveUpdate(); saveState();
}
function setFallEnabled(on){
  fallEnabled=on;
  document.getElementById('fallOnBtn').classList.toggle('on',on);
  document.getElementById('fallOffBtn').classList.toggle('on',!on);
  document.getElementById('fallBody').classList.toggle('disabled',!on);
  liveUpdate(); saveState();
}

/* ── 계산 엔진 ── */
function computeAll(){
  var attTotal=0, fallTotal=0;
  var attGroups=[], fallGroups=[];
  var attMap={}, attOrder=[];
  document.querySelectorAll('#attGradeGroups .grade-block').forEach(function(b){
    var g={ g0:parseFloat(b.querySelector('.ag0').value)||0, g30:parseFloat(b.querySelector('.ag30').value)||0, g50:parseFloat(b.querySelector('.ag50').value)||0,
      g80:parseFloat(b.querySelector('.ag80').value)||0, g100:parseFloat(b.querySelector('.ag100').value)||0 };
    var pj=readPj('att',b)||('표본'+b.dataset.idx);
    if(!attMap[pj]){ attMap[pj]={label:pj,g0:0,g30:0,g50:0,g80:0,g100:0,n:0}; attOrder.push(pj); }
    attMap[pj].g0+=g.g0; attMap[pj].g30+=g.g30; attMap[pj].g50+=g.g50; attMap[pj].g80+=g.g80; attMap[pj].g100+=g.g100; attMap[pj].n+=1;
  });
  attOrder.forEach(function(pj){
    var m=attMap[pj]; var ratio=ratioOf5(m);
    attGroups.push({label:pj+(m.n>1?' ('+m.n+'주 합산)':''),ratio:ratio,g0:m.g0,g30:m.g30,g50:m.g50,g80:m.g80,g100:m.g100});
  });
  document.querySelectorAll('#fallGradeGroups .grade-block').forEach(function(b){
    var g={ g0:parseFloat(b.querySelector('.fg0').value)||0, g30:parseFloat(b.querySelector('.fg30').value)||0, g50:parseFloat(b.querySelector('.fg50').value)||0,
      g80:parseFloat(b.querySelector('.fg80').value)||0, g100:parseFloat(b.querySelector('.fg100').value)||0 };
    var ratio=ratioOf5(g);
    var mode=b.dataset.mode||'census';
    var cnt=0;
    if(mode==='census'){
      cnt=parseFloat((b.querySelector('.fallCntInput').value||'').replace(/,/g,''))||0;
    } else {
      var target=parseFloat((b.querySelector('.fallTargetInput').value||'').replace(/,/g,''))||0;
      var sum=0,cardCnt=0;
      b.querySelectorAll('.fallSampSlot').forEach(function(el){ var v=parseFloat(el.value); if(!isNaN(v)&&el.value!==''){ sum+=v; cardCnt+=1; } });
      cnt = cardCnt>0 ? Math.round((sum/cardCnt)*target) : 0;
      var autoEl=document.getElementById('fallAutoCnt_'+b.dataset.idx); if(autoEl) autoEl.textContent=fmt(cnt);
    }
    var admit = fallEnabled ? Math.round(cnt*ratio/100) : 0;
    fallTotal+=admit;
    fallGroups.push({idx:b.dataset.idx,label:mode==='census'?'':(readPj('fall',b)||('품종'+b.dataset.idx)),cnt:cnt,ratio:ratio,admitCnt:admit,g0:g.g0,g30:g.g30,g50:g.g50,g80:g.g80,g100:g.g100});
  });
  var grandTotal=fallTotal;
  return { attGroups:attGroups, fallGroups:fallGroups, attTotal:attTotal, fallTotal:fallTotal, grandTotal:grandTotal };
}
function liveUpdate(){
  var R=computeAll();
  document.querySelectorAll('#attGradeGroups .grade-block').forEach(function(b){
    var g={ g0:parseFloat(b.querySelector('.ag0').value)||0, g30:parseFloat(b.querySelector('.ag30').value)||0, g50:parseFloat(b.querySelector('.ag50').value)||0,
      g80:parseFloat(b.querySelector('.ag80').value)||0, g100:parseFloat(b.querySelector('.ag100').value)||0 };
    var el=document.getElementById('attRatio_'+b.dataset.idx);
    if(el) el.textContent=ratioOf5(g).toFixed(2)+'%';
    var sumEl=document.getElementById('attSum_'+b.dataset.idx);
    if(sumEl) sumEl.textContent='합계 '+fmt(g.g0+g.g30+g.g50+g.g80+g.g100)+'개';
  });
  document.querySelectorAll('#fallGradeGroups .grade-block').forEach(function(b){
    var g={ g0:parseFloat(b.querySelector('.fg0').value)||0, g30:parseFloat(b.querySelector('.fg30').value)||0, g50:parseFloat(b.querySelector('.fg50').value)||0,
      g80:parseFloat(b.querySelector('.fg80').value)||0, g100:parseFloat(b.querySelector('.fg100').value)||0 };
    var ratioTxt=ratioOf5(g).toFixed(2)+'%';
    var sumTxt='합계 '+fmt(g.g0+g.g30+g.g50+g.g80+g.g100)+'개';
    var idx=b.dataset.idx;
    ['fallRatio_'+idx,'fallRatioS_'+idx].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=ratioTxt; });
    ['fallSum_'+idx,'fallSumS_'+idx].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=sumTxt; });
  });
  var box=document.getElementById('resultBox'), detail=document.getElementById('resultDetail');
  var attStats=[];
  if(attEnabled && R.attGroups.length){
    R.attGroups.forEach(function(g){
      attStats.push({label:esc(g.label)+' 피해구성비율', val:g.ratio.toFixed(2)+'%', color:'#FFD0D0'});
    });
  }
  var fallTotG=null;
  if(fallEnabled && R.fallGroups.length){
    fallTotG={g0:0,g30:0,g50:0,g80:0,g100:0};
    R.fallGroups.forEach(function(g){ fallTotG.g0+=g.g0; fallTotG.g30+=g.g30; fallTotG.g50+=g.g50; fallTotG.g80+=g.g80; fallTotG.g100+=g.g100; });
  }
  if(attStats.length || fallTotG){
    var html='<div style="display:flex;flex-direction:column;gap:10px;width:100%">';
    attStats.forEach(function(s,idx){
      if(idx>0) html+='<div style="height:1px;background:rgba(255,255,255,0.18)"></div>';
      html+='<div style="text-align:center">'+
        '<div style="font-size:11.5px;color:rgba(255,255,255,0.8);font-weight:600;margin-bottom:3px">'+s.label+'</div>'+
        '<div style="font-size:20px;font-weight:900;color:'+s.color+';letter-spacing:-0.02em;white-space:nowrap">'+s.val+'</div>'+
      '</div>';
    });
    if(fallTotG){
      if(attStats.length) html+='<div style="height:1px;background:rgba(255,255,255,0.18)"></div>';
      var fallRatioTot=ratioOf5(fallTotG);
      html+='<div style="display:flex;align-items:center">'+
        '<div style="flex:1;text-align:center">'+
          '<div style="font-size:11.5px;color:rgba(255,255,255,0.8);font-weight:600;margin-bottom:3px">낙과피해구성비율</div>'+
          '<div style="font-size:20px;font-weight:900;color:#FFD0D0;letter-spacing:-0.02em;white-space:nowrap">'+fallRatioTot.toFixed(2)+'%</div>'+
        '</div>'+
        '<div style="width:1px;height:40px;background:rgba(255,255,255,0.28);flex-shrink:0"></div>'+
        '<div style="flex:1;text-align:center">'+
          '<div style="font-size:11.5px;color:rgba(255,255,255,0.8);font-weight:600;margin-bottom:3px">낙과인정피해과실수</div>'+
          '<div style="font-size:20px;font-weight:900;color:#fff;letter-spacing:-0.02em;white-space:nowrap">'+fmt(R.fallTotal)+' 개</div>'+
        '</div>'+
      '</div>';
    }
    html+='</div>';
    detail.innerHTML=html;
    box.classList.remove('pending');
  } else {
    detail.innerHTML='<div style="text-align:center;color:rgba(255,255,255,0.75);font-size:13px;padding:10px 0;width:100%">계산하기를 눌러주세요</div>';
    box.classList.add('pending');
  }
  return R;
}

function calc(silent){
  var R=liveUpdate();
  if(!attEnabled && !fallEnabled){ if(!silent) showToast('착과피해조사 또는 낙과피해조사 중 하나는 실시로 설정하세요'); return; }
  LAST=R;
  document.getElementById('saveBtn').disabled=false;
  document.getElementById('content').classList.add('locked');
  document.getElementById('btnCalc').classList.remove('active');
  document.getElementById('btnEdit').classList.add('active');
  setLockUI(true);
  if(!silent){
    saveState();
    saveToHistory(R);
    vibrate([30,40,60]);
    document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function edit(silent){
  document.getElementById('content').classList.remove('locked');
  document.getElementById('btnCalc').classList.add('active');
  document.getElementById('btnEdit').classList.remove('active');
  document.getElementById('saveBtn').disabled=true;
  setLockUI(false);
  if(!silent) vibrate([12]);
  saveState();
}
function setLockUI(locked){ var hs=document.getElementById('hdrState'); if(hs){ hs.textContent=locked?'🔒 잠금':'🔓 수정 중'; hs.className='hdr-state '+(locked?'locked':'unlocked'); } }

/* ── 저장/복원 ── */
function saveState(){
  try{
    var st={ attBlocks:currentAttBlocks(), fallBlocks:currentFallBlocks(), attEnabled:attEnabled, fallEnabled:fallEnabled };
    FIELDS.forEach(function(id){ var el=document.getElementById(id); if(el) st[id]=el.value; });
    st.calcDone=document.getElementById('content').classList.contains('locked');
    localStorage.setItem(KEY_STATE, JSON.stringify(st));
  }catch(e){}
}
function restoreState(){
  var st=null; try{ st=JSON.parse(localStorage.getItem(KEY_STATE)||'null'); }catch(e){}
  if(!st) return false;
  FIELDS.forEach(function(id){ var el=document.getElementById(id); if(el&&st[id]!==undefined) el.value=st[id]; });
  attEnabled = st.attEnabled!==undefined ? st.attEnabled : false;
  fallEnabled = st.fallEnabled!==undefined ? st.fallEnabled : false;
  setAttEnabled(attEnabled); setFallEnabled(fallEnabled);
  buildAttBlocks(st.attBlocks||null);
  buildFallBlocks(st.fallBlocks||null);
  syncDate();
  document.querySelectorAll('.inp').forEach(mark);
  liveUpdate();
  if(st.calcDone){ calc(true); }
  return true;
}

function toggleBigText(){
  var on=document.body.classList.toggle('big-text');
  document.getElementById('bigtextBtn').classList.toggle('on',on);
  document.getElementById('bigtextLabel').textContent=on?'작게':'크게';
  try{ localStorage.setItem(KEY_BIG,on?'1':'0'); }catch(e){}
}

function openReset(){ document.getElementById('resetOverlay').classList.add('show'); }
function closeReset(){ document.getElementById('resetOverlay').classList.remove('show'); }
function doReset(){
  try{ localStorage.removeItem(KEY_STATE); }catch(e){}
  try{
    FIELDS.forEach(function(id){ var el=document.getElementById(id); if(!el) return;
      if(id==='attBlockN'||id==='fallBlockN') el.value='1';
      else if(id==='cropAtt'||id==='cropFall') el.value='사과';
      else if(id==='surveyDate'){ el.value=todayStr(); } else el.value='';
    });
  }catch(e){}
  attEnabled=false; fallEnabled=false;
  setAttEnabled(false); setFallEnabled(false);
  buildAttBlocks({}); buildFallBlocks({});
  syncDate();
  document.querySelectorAll('.inp').forEach(mark);
  liveUpdate();
  edit(true);
  var resBox=document.getElementById('resultBox'); if(resBox) resBox.className='result-box pending';
  var sbtn=document.getElementById('saveBtn'); if(sbtn) sbtn.disabled=true;
  LAST=null;
  closeReset();
  showToast('초기화 완료');
}

function getHistory(){ try{ return JSON.parse(localStorage.getItem(KEY_HIST)||'[]'); }catch(e){ return []; } }
function saveToHistory(R){
  var recs=getHistory();
  var farmNo=val('farmNo'), contractorName=val('contractorName');
  if(farmNo){ recs=recs.filter(function(r){ return r.farmNo!==farmNo; }); }
  recs.unshift({ ts:Date.now(), farmNo:farmNo, contractorName:contractorName, date:val('surveyDate')||'',
    grandTotal:R.grandTotal, state:localStorage.getItem(KEY_STATE) });
  if(recs.length>30) recs=recs.slice(0,30);
  try{ localStorage.setItem(KEY_HIST, JSON.stringify(recs)); }catch(e){}
}
function openHistory(){
  var recs=getHistory(), wrap=document.getElementById('historyList');
  if(!recs.length){ wrap.innerHTML='<p style="text-align:center;color:#aaa;font-size:13px;padding:18px 0">저장된 기록이 없습니다</p>'; }
  else{
    wrap.innerHTML=recs.map(function(r,i){
      var d=r.date?r.date.replace(/-/g,'.'):'날짜 미입력';
      var savedAt=r.ts?new Date(r.ts).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/ /g,''):'';
      return '<div class="hist-item" onclick="loadHistory('+i+')">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
          '<span style="font-size:15px;font-weight:800;color:var(--blue)">'+(r.contractorName?r.contractorName+'('+(r.farmNo||'-')+')':(r.farmNo?'농지 '+r.farmNo:'농지번호 미입력'))+'</span>'+
          '<span style="font-size:11px;color:#aaa">'+savedAt+'</span>'+
        '</div>'+
        '<div style="display:flex;gap:8px 10px;flex-wrap:wrap">'+
          '<span style="font-size:12px;color:#555">🗓 '+d+'</span>'+
          '<span style="font-size:12px;color:#555">🎯 '+fmt(r.grandTotal||0)+'개</span>'+
        '</div>'+
        '<div style="margin-top:8px;display:flex;justify-content:flex-end;gap:6px">'+
          '<button onclick="event.stopPropagation();delHistory('+i+')" style="height:26px;padding:0 10px;border:1px solid #ffb3b3;border-radius:6px;background:#fff;color:#e24b4a;font-size:11px;font-weight:700;cursor:pointer">삭제</button>'+
          '<button onclick="event.stopPropagation();loadHistory('+i+')" style="height:26px;padding:0 10px;border:none;border-radius:6px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;cursor:pointer">불러오기</button>'+
        '</div></div>';
    }).join('');
  }
  document.getElementById('historyOverlay').classList.add('show');
}
function closeHistory(){ document.getElementById('historyOverlay').classList.remove('show'); }
function loadHistory(i){
  var r=getHistory()[i]; if(!r||!r.state) return;
  try{ localStorage.setItem(KEY_STATE, r.state); }catch(e){}
  restoreState(); closeHistory(); edit(true);
  document.getElementById('saveBtn').disabled=true; LAST=null;
  showToast('불러왔습니다');
}
function delHistory(i){ var recs=getHistory(); recs.splice(i,1); try{ localStorage.setItem(KEY_HIST, JSON.stringify(recs)); }catch(e){} openHistory(); }

/* ── 갤러리 저장 ── */
function buildCapture(){
  var L=LAST; if(!L) return '';
  var farmNo=val('farmNo')||'-', contractorName=val('contractorName')||'';
  var date=val('surveyDate'); date=date?date.replace(/-/g,'.'):'-';

  var TH='background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:7px 4px;border:1px solid #cfd8e0;text-align:center';
  var TD='font-size:12px;padding:6px 4px;border:1px solid #cfd8e0;text-align:center;background:#fff;color:#111;font-weight:700';
  var TF='font-size:12px;padding:6px 4px;border:1px solid #cfd8e0;text-align:center;background:#eaf2fb;color:var(--blue);font-weight:800';
  var secNo=1;

  function section(title,inner){
    return '<div style="font-size:14px;font-weight:800;color:var(--blue);margin:16px 0 6px;border-left:4px solid var(--blue);padding-left:8px">'+(secNo++)+'. '+title+'</div>'+inner;
  }
  function tbl(inner){ return '<table style="width:100%;border-collapse:collapse;table-layout:fixed">'+inner+'</table>'; }

  var cAtt=''; var attTotRatio=0;
  if(attEnabled && L.attGroups.length){
    var ta=''; var totG={g0:0,g30:0,g50:0,g80:0,g100:0};
    L.attGroups.forEach(function(g){
      var sum=g.g0+g.g30+g.g50+g.g80+g.g100;
      totG.g0+=g.g0; totG.g30+=g.g30; totG.g50+=g.g50; totG.g80+=g.g80; totG.g100+=g.g100;
      ta+='<tr><td style="'+TD+'">'+esc(g.label)+'</td><td style="'+TD+'">'+fmt(g.g0)+'</td><td style="'+TD+'">'+fmt(g.g30)+'</td><td style="'+TD+'">'+fmt(g.g50)+'</td><td style="'+TD+'">'+fmt(g.g80)+'</td><td style="'+TD+'">'+fmt(g.g100)+'</td><td style="'+TD+'">'+fmt(sum)+'</td><td style="'+TF+'">'+g.ratio.toFixed(2)+'%</td></tr>';
    });
    var totSum=totG.g0+totG.g30+totG.g50+totG.g80+totG.g100;
    attTotRatio=ratioOf5(totG);
    ta+='<tr><td style="'+TF+'">합계</td><td style="'+TF+'">'+fmt(totG.g0)+'</td><td style="'+TF+'">'+fmt(totG.g30)+'</td><td style="'+TF+'">'+fmt(totG.g50)+'</td><td style="'+TF+'">'+fmt(totG.g80)+'</td><td style="'+TF+'">'+fmt(totG.g100)+'</td><td style="'+TF+'">'+fmt(totSum)+'</td><td style="'+TF+'">'+attTotRatio.toFixed(2)+'%</td></tr>';
    cAtt=section('착과피해조사',
      tbl('<colgroup><col style="width:20%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:20%"></colgroup>'+
        '<thead><tr><th style="'+TH+'">품종</th><th style="'+TH+'">정상</th><th style="'+TH+'">30%형</th><th style="'+TH+'">50%형</th><th style="'+TH+'">80%형</th><th style="'+TH+'">100%형</th><th style="'+TH+'">합계</th><th style="'+TH+'">피해구성비율</th></tr></thead><tbody>'+ta+'</tbody>'));
  }
  var cFall='';
  if(fallEnabled && L.fallGroups.length){
    var tf=''; L.fallGroups.forEach(function(g){
      var sum=g.g0+g.g30+g.g50+g.g80+g.g100;
      tf+='<tr><td style="'+TD+'">'+(g.label?esc(g.label):'-')+'</td><td style="'+TD+'">'+fmt(g.cnt)+'</td><td style="'+TD+'">'+fmt(g.g0)+'</td><td style="'+TD+'">'+fmt(g.g30)+'</td><td style="'+TD+'">'+fmt(g.g50)+'</td><td style="'+TD+'">'+fmt(g.g80)+'</td><td style="'+TD+'">'+fmt(g.g100)+'</td><td style="'+TD+'">'+fmt(sum)+'</td><td style="'+TD+'">'+g.ratio.toFixed(2)+'%</td><td style="'+TF+'">'+fmt(g.admitCnt)+'</td></tr>';
    });
    tf+='<tr><td colspan="9" style="'+TF+'">낙과인정피해과실수 합계</td><td style="'+TF+'">'+fmt(L.fallTotal)+'</td></tr>';
    cFall=section('낙과피해조사',
      tbl('<colgroup><col style="width:14%"><col style="width:9%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:10%"><col style="width:14%"></colgroup>'+
        '<thead><tr><th style="'+TH+'">품종</th><th style="'+TH+'">낙과수</th><th style="'+TH+'">정상</th><th style="'+TH+'">30%형</th><th style="'+TH+'">50%형</th><th style="'+TH+'">80%형</th><th style="'+TH+'">100%형</th><th style="'+TH+'">합계</th><th style="'+TH+'">피해구성비율</th><th style="'+TH+'">인정피해과실수</th></tr></thead><tbody>'+tf+'</tbody>'));
  }

  var TR='font-size:14px;padding:8px 4px;border:1px solid #cfd8e0;text-align:center;background:#fff;color:var(--blue);font-weight:800';
  var resultRows='';
  if(attEnabled && L.attGroups.length){
    resultRows+='<td style="'+TH+'">착과피해구성률</td><td style="'+TR+'">'+attTotRatio.toFixed(2)+'%</td>';
  }
  if(fallEnabled && L.fallGroups.length){
    resultRows+='<td style="'+TH+'">낙과인정피해과실수</td><td style="'+TR+'">'+fmt(L.fallTotal)+' 개</td>';
  }
  var cResult=section('결과', tbl('<tbody><tr>'+resultRows+'</tr></tbody>'));

  return '<div style="width:680px;background:#fff;font-family:-apple-system,Noto Sans KR,sans-serif;padding:20px;box-sizing:border-box">'+
    '<div style="background:var(--blue);color:#fff;border-radius:12px;padding:11px 14px;display:flex;align-items:baseline;gap:10px;white-space:nowrap">'+
      '<span style="font-size:12.5px;font-weight:700;flex-shrink:0">'+date+'</span>'+
      '<span style="font-size:12.5px;font-weight:700;flex-shrink:0;letter-spacing:0.4px">'+(contractorName?esc(contractorName)+(farmNo!=='-'?' ('+farmNo+')':''):(farmNo!=='-'?'농지 '+farmNo:''))+'</span>'+
      '<span style="font-size:13.5px;font-weight:800;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis">🍏 착과·낙과피해 계산결과</span>'+
    '</div>'+
    cAtt+cFall+cResult+
  '</div>';
}
function saveImage(){
  if(!LAST){ showToast('먼저 계산하세요'); return; }
  if(typeof html2canvas==='undefined'){ showToast('이미지 모듈을 불러오지 못했습니다<br>(최초 1회는 온라인 필요)'); return; }
  var box=document.getElementById('captureBox');
  box.innerHTML=buildCapture();
  showToast('이미지 만드는 중…');
  html2canvas(box,{scale:2,backgroundColor:'#fff',useCORS:true,windowWidth:680}).then(function(canvas){
    box.innerHTML='';
    var farmNo=(val('farmNo')||'농지').replace(/[^0-9]/g,'')||'농지';
    var d=new Date(), stamp=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'_'+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2);
    var dataUrl=canvas.toDataURL('image/png');
    var link=document.createElement('a');
    link.download='착과낙과피해_'+farmNo+'_'+stamp+'.png';
    link.href=dataUrl; link.click();
    saveToSharedHistory(dataUrl);
    document.getElementById('saveDoneOverlay').classList.add('show');
  }).catch(function(){ box.innerHTML=''; showToast('저장에 실패했습니다'); });
}
function saveToSharedHistory(imgDataUrl){
  if(!LAST) return;
  var farmFull=val('farmNo')||''; var contractorName=val('contractorName')||'';
  var farm4=(farmFull.replace(/[^0-9]/g,'').slice(-4))||farmFull;
  var n=new Date(), p=function(x){return ('0'+x).slice(-2);};
  var savedAt=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'T'+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  var id=Date.now();
  try{
    var hist=JSON.parse(localStorage.getItem('save_history')||'[]');
    var removed=[];
    if(farmFull){ hist=hist.filter(function(r){ var dup=(r.src==='fruitdamage' && (r.fullFarmNo||r.farmNo)===farmFull); if(dup) removed.push(String(r.id)); return !dup; }); }
    hist.unshift({ id:id, src:'fruitdamage', savedAt:savedAt, crop:'과수4종', cropDetail:'착과낙과피해', farmNo:farm4, fullFarmNo:farmFull, contractorName:contractorName, category:'과수' });
    if(hist.length>200) hist=hist.slice(0,200);
    localStorage.setItem('save_history', JSON.stringify(hist));
    var cache=JSON.parse(localStorage.getItem('save_img_cache')||'[]');
    if(removed.length) cache=cache.filter(function(c){ return removed.indexOf(String(c.id))<0; });
    if(imgDataUrl) cache.unshift({ id:id, img:imgDataUrl });
    if(cache.length>60) cache=cache.slice(0,60);
    localStorage.setItem('save_img_cache', JSON.stringify(cache));
  }catch(e){}
}

/* ── 초기 구동 ── */
(function init(){
  try{ if(localStorage.getItem(KEY_BIG)==='1'){ document.body.classList.add('big-text'); document.getElementById('bigtextBtn').classList.add('on'); document.getElementById('bigtextLabel').textContent='작게'; } }catch(e){}
  if(!restoreState()){
    document.getElementById('attBlockN').value='1';
    document.getElementById('fallBlockN').value='1';
    setAttEnabled(false); setFallEnabled(false);
    buildAttBlocks({}); buildFallBlocks({});
    document.querySelectorAll('.inp').forEach(mark);
  }
  if(!document.getElementById('surveyDate').value){ document.getElementById('surveyDate').value=todayStr(); }
  syncDate();
  liveUpdate();
  document.getElementById('content').addEventListener('input',function(){
    if(!document.getElementById('content').classList.contains('locked')) liveUpdate();
  },{passive:true});
})();
</script>
