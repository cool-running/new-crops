<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>밤 피해율 계산기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --blue:#185FA5;--blue2:#378ADD;
  --auto:#F3F1EA;--border:#D8D6CE;--binp:#378ADD;
  --text:#1a1a1a;--sub:#666;--hint:#aaa;
  --bg:#F5F4F0;--card:#fff;
  --red:#e24b4a;--green:#1D9E75;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}

.header{background:var(--blue);color:white;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}
.back-btn{width:32px;height:32px;background:rgba(255,255,255,0.15);border:none;border-radius:8px;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-icon{width:28px;height:28px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.header h1{font-size:16px;font-weight:600}
.header-sub{font-size:11px;opacity:0.75;margin-top:1px}
.hdr-state{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,0.92);border:1px solid rgba(255,255,255,0.6);white-space:nowrap;transition:all .15s}
.hdr-state.unlocked{color:#137a4d}
.hdr-state.locked{color:#c0392b}

.legend{display:flex;gap:12px;padding:8px 16px;background:var(--card);border-bottom:0.5px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.dot-inp{width:10px;height:10px;border-radius:2px;background:white;border:1.5px solid var(--binp)}
.dot-auto{width:10px;height:10px;border-radius:2px;background:var(--auto);border:0.5px solid var(--border)}
.dot-filled{width:10px;height:10px;border-radius:2px;background:#e8faf3;border:1.5px solid var(--green)}

.content{padding:12px 12px 60px}
.section{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;border:0.5px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,0.04)}
.sec-title{font-size:13px;font-weight:700;color:#555;margin-bottom:12px;letter-spacing:0.02em}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-head .sec-title{margin-bottom:0}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.field{display:flex;flex-direction:column;gap:3px;position:relative}
.field label{font-size:11px;color:var(--sub);font-weight:500}

input.inp{height:40px;border:1.5px solid var(--binp);border-radius:var(--rs);padding:0 8px;font-size:14px;background:white;color:var(--text);width:100%;-webkit-appearance:none;transition:background 0.15s,border-color 0.15s;text-align:center}
select.inp{height:40px;border:1.5px solid var(--binp);border-radius:var(--rs);padding:0 8px;font-size:14px;background:white;color:var(--text);width:100%;-webkit-appearance:none;transition:background 0.15s,border-color 0.15s;text-align:center;text-align-last:center}
input.inp::placeholder{color:var(--hint);text-align:center}
input.inp.filled,select.inp.filled{background:#e8faf3;border-color:var(--green);color:#000;font-weight:700}
input.inp:focus,select.inp:focus,input.inp.mobile-focus{outline:none !important;border-color:#185FA5 !important;box-shadow:0 0 0 3px rgba(55,138,221,0.22) !important;background:#DCEEFF !important;color:#185FA5 !important}

.datewrap{position:relative;width:100%}
.datewrap .date-disp{height:40px;border:1.5px solid var(--binp);border-radius:var(--rs);padding:0 8px;font-size:14px;background:white;color:var(--text);width:100%;text-align:center;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.datewrap.filled .date-disp{background:#e8faf3;border-color:var(--green);color:#000;font-weight:700}
.datewrap .date-disp.ph{color:var(--hint);font-weight:400}
.datewrap input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;margin:0;padding:0;cursor:pointer;z-index:2}
.datewrap:focus-within .date-disp{border-color:var(--blue);box-shadow:0 0 0 3px rgba(55,138,221,0.15);background:#dceeff;color:#185FA5}

input.auto{height:40px;border:0.5px solid var(--border);border-radius:var(--rs);padding:0 8px;font-size:14px;background:var(--auto);color:var(--sub);width:100%;-webkit-appearance:none;text-align:center;font-weight:600}
input.auto.ok{background:#eef6ef;border-color:#bcd9c2;color:#137a4d}

.unit-badge{position:absolute;right:6px;top:0;font-size:10px;font-weight:600;color:var(--sub);background:var(--bg);border-radius:4px;padding:1px 4px;line-height:1.4;pointer-events:none;z-index:1}

.bigtext-btn,.reset-btn{height:34px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--sub)}
.reset-btn{color:var(--red);border-color:#f0c9c8}

/* 품종 카드 */
.variety-card{background:var(--bg);border-radius:var(--r);padding:0;margin-bottom:12px;border:0.5px solid var(--border);overflow:hidden}
.vc-head{display:flex;align-items:center;gap:10px;cursor:pointer;background:#185FA5;padding:11px 12px}
.vc-head.open{background:transparent;padding:12px 12px 0}
.vc-num{width:24px;height:24px;background:rgba(255,255,255,0.22);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.vc-head.open .vc-num{background:var(--blue)}
.vc-title{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vc-name{font-size:14px;font-weight:800;color:#fff;white-space:nowrap}
.vc-head.open .vc-name{color:var(--text)}
.vc-sum{font-size:13px;font-weight:700;color:#A8F0D8;display:flex;align-items:center;gap:6px}
.vc-icon{font-size:13px;color:rgba(255,255,255,0.85);flex-shrink:0}
.vc-head.open .vc-icon{color:var(--sub)}
.vc-body{padding:12px}
.subhead{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:0.04em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.subhead:first-child{margin-top:0}
.subhead .bar{flex:1;height:1px;background:var(--border)}
.del-variety-btn{height:30px;width:30px;border:none;background:rgba(255,255,255,0.18);color:#fff;cursor:pointer;font-size:17px;border-radius:7px;flex-shrink:0}
.vc-head.open .del-variety-btn{background:transparent;color:var(--red)}
.add-variety-btn{width:100%;height:44px;border:2px dashed var(--blue2);background:#EBF4FF;border-radius:var(--rs);font-size:14px;font-weight:800;color:var(--blue);cursor:pointer}
.add-variety-btn:active{background:var(--auto);transform:translateY(1px)}

.autobox{background:#f0f5fb;border-radius:10px;padding:9px 10px 6px;margin-top:6px}
.autobox label{color:#4a7aad}

.info-strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:12px 4px 0;margin-top:12px;border-top:1px solid var(--border)}
.info-strip span{flex:1;min-width:90px;font-size:12px;color:var(--sub)}
.info-strip strong{font-size:15px;color:var(--text);font-weight:800}

/* 계산/수정 버튼 */
.calc-action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btn-calc{height:46px;border:none;border-radius:12px;background:var(--blue);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-edit{height:46px;border:2px solid var(--green);border-radius:12px;background:white;color:var(--green);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-calc.active{background:linear-gradient(135deg,#185FA5 0%,#2478cc 100%);box-shadow:0 4px 14px rgba(24,95,165,0.35)}
.btn-edit.active{background:var(--green);color:white;box-shadow:0 4px 14px rgba(29,158,117,0.35)}

/* 결과 */
.result-box{background:linear-gradient(135deg,#185FA5 0%,#2478cc 100%);border-radius:18px;padding:0 12px;margin-bottom:10px;color:white;border:1.5px solid rgba(255,255,255,0.25);box-shadow:0 8px 28px rgba(24,95,165,0.5),inset 0 1px 0 rgba(255,255,255,0.2)}
.result-box.pending{background:linear-gradient(135deg,#888 0%,#aaa 100%);border:1.5px solid rgba(255,255,255,0.15);box-shadow:none}
.save-btn{background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);color:white;border-radius:12px;height:36px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 14px;white-space:nowrap;flex-shrink:0}
.detail-box{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;border:0.5px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,0.04)}
.drow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:0.5px solid #eee}
.drow:last-child{border-bottom:none}
.drow span:first-child{color:var(--sub)}
.drow span:last-child{font-weight:700;color:var(--text)}

/* 잠금 */
.locked input.inp:not([type=date]),.locked select.inp,.locked .vc-body input,.locked .add-variety-btn,.locked .del-variety-btn{pointer-events:none;opacity:0.72}
.locked .datewrap{pointer-events:none;opacity:0.72}

/* 모달 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:white;border-radius:var(--r);padding:22px 20px;text-align:center;width:100%;max-width:300px}
.modal .mt{font-size:17px;font-weight:800;color:#333;margin-bottom:8px}
.modal .md{font-size:13px;line-height:1.6;color:#666;margin-bottom:18px;text-align:left;white-space:pre-line}
.modal .row{display:flex;gap:8px}
.modal button{flex:1;height:44px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;border:none}
.btn-primary{background:var(--blue);color:white}
.btn-ghost{background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.btn-danger{background:var(--red);color:white}

#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,20,0.92);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:22px;z-index:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hist-item{display:flex;align-items:center;gap:8px;padding:11px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fafafa}
.hist-item:active{background:#eef4fb}
.hist-main{flex:1;min-width:0;text-align:left}
.hist-no{font-size:14px;font-weight:800;color:var(--blue)}
.hist-meta{font-size:11px;color:var(--sub);margin-top:2px}
.hist-del{width:30px;height:30px;border:none;background:transparent;color:var(--red);font-size:16px;cursor:pointer;flex-shrink:0}

/* 크게보기 */
body.big-text input.inp,body.big-text select.inp,body.big-text input.auto{height:50px !important;font-size:18px !important;font-weight:600}
body.big-text .datewrap .date-disp{height:50px;font-size:17px}
body.big-text .vc-body input{height:48px !important;font-size:17px !important}
body.big-text .field label{font-size:13px !important}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="if(window.history.length>1)history.back();else location.href='./index.html'">‹</button>
  <div class="header-icon">🌰</div>
  <div style="flex:1">
    <h1>밤 피해율 계산기</h1>
    <div class="header-sub">종합위험 수확감소 · 수확개시 전</div>
  </div>
  <div class="hdr-state unlocked" id="hdrState">🔓 수정 중</div>
</div>

<div class="legend">
  <div class="legend-item"><div class="dot-inp"></div>직접 입력</div>
  <div class="legend-item"><div class="dot-filled"></div>입력 완료</div>
  <div class="legend-item"><div class="dot-auto"></div>자동 계산</div>
</div>

<div class="content">

  <!-- 농지정보 -->
  <div class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="bigtext-btn" id="bigtext-btn" onclick="toggleBigText()">🔍 <span id="bigtext-label">크게</span></button>
      <button class="reset-btn" onclick="openModal('reset-overlay')">전체 초기화</button>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <div class="field" style="flex:1.3">
        <label>농지번호</label>
        <input type="text" id="farm_no" class="inp" inputmode="numeric" placeholder="농지번호"
          maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'');markFilled(this);saveState()" autocomplete="off">
      </div>
      <div class="field" style="flex:1.3">
        <label>조사일자</label>
        <div class="datewrap"><div class="date-disp ph" data-ph="조사일자">조사일자</div><input type="date" id="survey_date" onchange="markFilled(this);saveState()" autocomplete="off"></div>
      </div>
      <div style="width:46px;flex-shrink:0">
        <button onclick="openHistoryModal()" title="이전 기록"
          style="width:100%;height:40px;border:1.5px solid var(--blue2);border-radius:var(--rs);background:white;color:var(--blue);font-size:19px;cursor:pointer">📋</button>
      </div>
    </div>
  </div>

  <!-- 평년수확량 · 미보상 -->
  <div class="section">
    <div class="sec-title">가입 · 평년 정보</div>
    <div class="g3">
      <div class="field">
        <label>평년수확량</label>
        <span class="unit-badge">kg</span>
        <input type="text" id="avg_yield" class="inp" inputmode="decimal"
          oninput="onCommaInput(this)" onblur="calc()" autocomplete="off">
      </div>
      <div class="field">
        <label>표준수확량</label>
        <span class="unit-badge">kg</span>
        <input type="text" id="std_yield" class="inp" inputmode="decimal"
          oninput="onCommaInput(this)" onblur="calc()" autocomplete="off">
      </div>
      <div class="field">
        <label>미보상비율</label>
        <span class="unit-badge">%</span>
        <input type="number" id="unins_rate" class="inp" inputmode="decimal"
          enterkeyhint="done" oninput="markFilled(this)" onblur="calc()"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" autocomplete="off">
      </div>
    </div>
    <div style="font-size:11px;color:var(--hint);margin-top:7px;line-height:1.5">
      표준수확량은 다품종 안분에만 사용됩니다. 단일품종이면 비워둬도 됩니다.
    </div>
  </div>

  <!-- 품종별 조사 -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-title" style="margin-bottom:0">품종별 조사 <span id="variety-count-badge" style="font-size:12px;font-weight:600;color:var(--blue)"></span></div>
    </div>
    <div id="variety-list"></div>
    <button class="add-variety-btn" onclick="addVariety()">＋ 품종 추가</button>

    <div class="info-strip">
      <span>전체 조사대상<br><strong id="t-survey">-</strong></span>
      <span>적정표본주<br><strong id="t-proper" style="color:var(--red)">-</strong></span>
      <span>입력 표본주<br><strong id="t-sample">-</strong></span>
    </div>
  </div>

  <!-- 계산/수정 -->
  <div class="calc-action-row">
    <button class="btn-edit active" id="btn-edit" onclick="setEditMode()">✏️ 수정하기</button>
    <button class="btn-calc" id="btn-calc" onclick="setCalcMode()">🔒 계산하기</button>
  </div>

  <!-- 결과 -->
  <div class="result-box pending" id="result-section">
    <div style="display:flex;align-items:center;padding:14px 0">
      <div style="padding-right:12px;flex-shrink:0">
        <span style="font-size:13px;color:rgba(255,255,255,0.75);font-weight:500;letter-spacing:0.04em">피해율</span>
      </div>
      <div style="width:1px;height:34px;background:rgba(255,255,255,0.28);flex-shrink:0"></div>
      <div style="padding:0 12px;flex:1;min-width:0">
        <span id="result-pct" style="font-size:30px;font-weight:800;color:#FFD0D0;letter-spacing:-0.02em;line-height:1;white-space:nowrap">- -</span>
      </div>
      <div style="width:1px;height:34px;background:rgba(255,255,255,0.28);flex-shrink:0"></div>
      <div style="padding-left:12px;flex-shrink:0">
        <button class="save-btn" onclick="saveImage()"><span style="font-size:14px">📷</span><span>저장</span></button>
      </div>
    </div>
  </div>

  <!-- 결과 상세 -->
  <div class="detail-box" id="detail-section" style="display:none">
    <div class="sec-title">산출 내역</div>
    <div class="drow"><span>평년수확량</span><span id="d-avg">-</span></div>
    <div class="drow"><span>수확량</span><span id="d-harvest">-</span></div>
    <div class="drow"><span>　└ 착과 수확량</span><span id="d-chak">-</span></div>
    <div class="drow"><span>　└ 낙과 수확량</span><span id="d-nak">-</span></div>
    <div class="drow"><span>　└ 미보상주수분</span><span id="d-uninstree">-</span></div>
    <div class="drow"><span>미보상감수량</span><span id="d-uninsloss">-</span></div>
    <div class="drow"><span>피해율</span><span id="d-pct" style="color:var(--red)">-</span></div>
  </div>

</div>

<!-- 초기화 모달 -->
<div class="overlay" id="reset-overlay">
  <div class="modal">
    <div class="mt">전체 초기화</div>
    <div class="md" style="text-align:center">모든 입력값을 지웁니다.
되돌릴 수 없습니다.</div>
    <div class="row">
      <button class="btn-ghost" onclick="closeModal('reset-overlay')">취소</button>
      <button class="btn-danger" onclick="resetAll()">초기화</button>
    </div>
  </div>
</div>

<!-- 검증 모달 -->
<div class="overlay" id="validation-overlay">
  <div class="modal">
    <div class="mt">입력 확인</div>
    <div class="md" id="validation-list"></div>
    <div class="row"><button class="btn-primary" onclick="closeModal('validation-overlay')">확인</button></div>
  </div>
</div>

<!-- 품종 삭제 모달 -->
<div class="overlay" id="delvar-overlay">
  <div class="modal">
    <div class="mt">품종 삭제</div>
    <div class="md" style="text-align:center" id="delvar-desc"></div>
    <div class="row">
      <button class="btn-ghost" onclick="closeModal('delvar-overlay')">취소</button>
      <button class="btn-danger" onclick="confirmDelVariety()">삭제</button>
    </div>
  </div>
</div>

<!-- 기록 모달 -->
<div class="overlay" id="history-overlay">
  <div class="modal" style="max-width:340px">
    <div class="mt">이전 기록</div>
    <div id="history-list" style="max-height:50vh;overflow-y:auto;margin-bottom:14px"></div>
    <div class="row"><button class="btn-ghost" onclick="closeModal('history-overlay')">닫기</button></div>
  </div>
</div>

<div id="toast"></div>

<!-- 캡처 템플릿 -->
<div id="capture-template" style="position:fixed;left:-99999px;top:0;width:430px;background:#f3f4f6;z-index:-1"></div>

<script>
/* ===== 데이터 모델 ===== */
function newVariety(){
  return {name:'',age:'',reg:0,unins:0,dead:0,sampleN:0,stdPer:0,
    chakSum:0,nakSum:0,
    wN:0,wS:0,fcnt:0,
    cNorm:0,c50:0,c80:0,c100:0,
    nNorm:0,n50:0,n80:0,n100:0,
    open:true};
}
let varieties=[newVariety()];
let _isLocked=false;
let _delVarIdx=-1;

/* ===== 유틸 ===== */
function toNum(el){ if(typeof el==='string') el=document.getElementById(el); if(!el) return 0; return parseFloat((el.value||'').replace(/,/g,''))||0; }
function onCommaInput(el){
  const raw=el.value.replace(/,/g,'').replace(/[^0-9.]/g,'');
  const parts=raw.split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  el.value=parts.join('.');
  el.classList.toggle('filled', el.value!=='' && el.value!=='0');
}
function markFilled(el){
  const has=el.value!=='';
  el.classList.toggle('filled',has);
  if(el.type==='date'){
    const wrap=el.closest('.datewrap');
    if(wrap){
      wrap.classList.toggle('filled',has);
      const disp=wrap.querySelector('.date-disp');
      if(disp){ if(has){disp.textContent=el.value;disp.classList.remove('ph');} else {disp.textContent=disp.getAttribute('data-ph');disp.classList.add('ph');} }
    }
  }
}
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
const fmtKg=v=>v.toLocaleString('ko-KR',{maximumFractionDigits:1})+' kg';

/* ===== 별표1: 밤·호두 표본주수표 ===== */
function properSample(n){
  if(n<=0) return 0;
  if(n<50) return 5; if(n<100) return 6; if(n<150) return 7; if(n<200) return 8;
  if(n<300) return 9; if(n<400) return 10; if(n<500) return 11; if(n<600) return 12;
  if(n<700) return 13; if(n<800) return 14; if(n<900) return 15; if(n<1000) return 16;
  return 17;
}
function surveyTarget(v){ return Math.max(0,(v.reg||0)-(v.unins||0)-(v.dead||0)); }
function properForVariety(vi){
  const st=surveyTarget(varieties[vi]);
  const totalSt=varieties.reduce((s,v)=>s+surveyTarget(v),0);
  if(st<=0||totalSt<=0) return 0;
  const totalProper=properSample(totalSt);
  return Math.max(1,Math.ceil(totalProper*st/totalSt));
}

/* ===== 렌더 ===== */
function fnum(v){ return (v&&v!==0)?Number(v).toLocaleString():''; }
function field(vi,key,label,unit,opts){
  opts=opts||{};
  const v=varieties[vi][key];
  const val=(v||v===0)&&v!==0?(opts.comma?Number(v).toLocaleString():v):'';
  const filled=v>0;
  const ph=opts.ph||'0';
  return `<div class="field">
    <label>${label}</label>${unit?`<span class="unit-badge">${unit}</span>`:''}
    <input type="text" inputmode="decimal" value="${val}" placeholder="${ph}" class="inp${filled?' filled':''}" autocomplete="off"
      oninput="onCellInput(this,${vi},'${key}')"
      onblur="onCellBlur(this,${vi},'${key}')"></div>`;
}
function onCellInput(el,vi,key){
  onCommaInput(el);
  varieties[vi][key]=parseFloat(el.value.replace(/,/g,''))||0;
}
function onCellBlur(el,vi,key){
  varieties[vi][key]=parseFloat(el.value.replace(/,/g,''))||0;
  // 주수 변경 시 적정표본 갱신을 위해 전체 재렌더
  if(key==='reg'||key==='unins'||key==='dead'){ renderVarieties(); }
  else { updateVarietyAuto(vi); }
  updateTotals();
  if(_isLocked) calc();
  saveState();
}

function renderVarieties(){
  const list=document.getElementById('variety-list');
  document.getElementById('variety-count-badge').textContent=`(${varieties.length}품종)`;
  list.innerHTML=varieties.map((v,vi)=>{
    const st=surveyTarget(v);
    const properN=properForVariety(vi);
    const sampleN=v.sampleN||properN;
    const perChak=sampleN>0?v.chakSum/sampleN:0;
    const perNak=sampleN>0?v.nakSum/sampleN:0;
    const gPer=v.fcnt>0?(v.wN+v.wS*0.8)/v.fcnt:0;
    const cTot=v.cNorm+v.c50+v.c80+v.c100;
    const nTot=v.nNorm+v.n50+v.n80+v.n100;
    const cRate=cTot>0?(v.c50*0.5+v.c80*0.8+v.c100)/cTot:0;
    const nRate=nTot>0?(v.n50*0.5+v.n80*0.8+v.n100)/nTot:0;
    const name=v.name||`품종${vi+1}`;
    const open=v.open!==false;
    const sumTxt=st>0?`조사 ${st}주 · 표본 ${sampleN}주`:'주수 미입력';

    const body=`<div class="vc-body" id="vc-body-${vi}" style="display:${open?'block':'none'}">
      <div class="g2" style="margin-bottom:8px">
        <div class="field"><label>품종명</label>
          <input type="text" value="${v.name||''}" placeholder="품종${vi+1}" class="inp${v.name?' filled':''}" autocomplete="off"
            style="text-align:left"
            oninput="varieties[${vi}].name=this.value;this.classList.toggle('filled',this.value!='')"
            onblur="renderVarieties();updateTotals();saveState()"></div>
        <div class="field"><label>수령 (선택)</label><span class="unit-badge">년</span>
          <input type="text" inputmode="numeric" value="${v.age||''}" placeholder="-" class="inp${v.age?' filled':''}" autocomplete="off"
            oninput="varieties[${vi}].age=this.value.replace(/[^0-9]/g,'');this.value=varieties[${vi}].age;this.classList.toggle('filled',this.value!='')"
            onblur="saveState()"></div>
      </div>

      <div class="subhead">주수 <div class="bar"></div></div>
      <div class="g3">
        ${field(vi,'reg','실제결과','주',{ph:'0'})}
        ${field(vi,'unins','미보상','주',{ph:'0'})}
        ${field(vi,'dead','고사나무','주',{ph:'0'})}
      </div>
      <div class="autobox g2" style="margin-bottom:0">
        <div class="field"><label>조사대상주수</label><input class="auto ok" id="a-st-${vi}" readonly value="${st>0?st+'주':''}"></div>
        <div class="field"><label>적정표본주 (별표1)</label><input class="auto" id="a-pn-${vi}" readonly value="${properN>0?properN+'주':''}"></div>
      </div>

      <div class="subhead">표본 조사 <div class="bar"></div></div>
      <div class="g3">
        <div class="field"><label>표본주수</label><span class="unit-badge">주</span>
          <input type="text" inputmode="numeric" value="${v.sampleN||''}" placeholder="${properN||'0'}" class="inp${v.sampleN?' filled':''}" autocomplete="off"
            oninput="varieties[${vi}].sampleN=parseInt(this.value.replace(/[^0-9]/g,''))||0;this.value=varieties[${vi}].sampleN||'';this.classList.toggle('filled',this.value!='')"
            onblur="updateVarietyAuto(${vi});updateTotals();if(_isLocked)calc();saveState()"></div>
        ${field(vi,'chakSum','착과수 합','개',{comma:true})}
        ${field(vi,'nakSum','낙과수 합','개',{comma:true})}
      </div>
      <div class="autobox g2" style="margin-bottom:0">
        <div class="field"><label>주당 착과수</label><input class="auto" id="a-pc-${vi}" readonly value="${perChak>0?perChak.toFixed(1)+'개':''}"></div>
        <div class="field"><label>주당 낙과수</label><input class="auto" id="a-pncnt-${vi}" readonly value="${perNak>0?perNak.toFixed(1)+'개':''}"></div>
      </div>

      <div class="subhead">과중 조사 (밤·송이) <div class="bar"></div></div>
      <div class="g3">
        ${field(vi,'wN','정상 무게','g',{comma:true})}
        ${field(vi,'wS','소과 무게','g',{comma:true})}
        ${field(vi,'fcnt','표본과실수','개',{comma:true})}
      </div>
      <div class="autobox" style="margin-bottom:0">
        <div class="field"><label>개당 과중 = {정상 + 소과×0.8} ÷ 표본과실수</label><input class="auto ok" id="a-gper-${vi}" readonly value="${gPer>0?gPer.toFixed(2)+' g':''}"></div>
      </div>

      <div class="subhead">착과 피해구성 (개수) <div class="bar"></div></div>
      <div class="g4">
        ${field(vi,'cNorm','정상',null)}
        ${field(vi,'c50','50%형',null)}
        ${field(vi,'c80','80%형',null)}
        ${field(vi,'c100','100%형',null)}
      </div>
      <div class="autobox" style="margin-bottom:0">
        <div class="field"><label>착과 피해구성률</label><input class="auto" id="a-crate-${vi}" readonly value="${cTot>0?(cRate*100).toFixed(2)+'%':''}"></div>
      </div>

      <div class="subhead">낙과 피해구성 (개수) <div class="bar"></div></div>
      <div class="g4">
        ${field(vi,'nNorm','정상',null)}
        ${field(vi,'n50','50%형',null)}
        ${field(vi,'n80','80%형',null)}
        ${field(vi,'n100','100%형',null)}
      </div>
      <div class="autobox g2" style="margin-bottom:0">
        <div class="field"><label>낙과 피해구성률</label><input class="auto" id="a-nrate-${vi}" readonly value="${nTot>0?(nRate*100).toFixed(2)+'%':''}"></div>
        <div class="field"><label>주당표준수확량 (선택)</label><span class="unit-badge">kg</span>
          <input type="text" inputmode="decimal" value="${v.stdPer||''}" placeholder="-" class="inp${v.stdPer?' filled':''}" autocomplete="off"
            oninput="onCommaInput(this);varieties[${vi}].stdPer=parseFloat(this.value.replace(/,/g,''))||0"
            onblur="if(_isLocked)calc();saveState()"></div>
      </div>
    </div>`;

    return `<div class="variety-card" id="vc-${vi}">
      <div class="vc-head ${open?'open':''}" onclick="toggleCard(${vi})">
        <div class="vc-num">${vi+1}</div>
        <div class="vc-title">
          <span class="vc-name">${name}${v.age?` ${v.age}년`:''}</span>
          ${open?'':`<span class="vc-sum">${sumTxt}</span>`}
        </div>
        ${varieties.length>1?`<button class="del-variety-btn" onclick="event.stopPropagation();askDelVariety(${vi})">🗑</button>`:''}
        <span class="vc-icon">${open?'▼':'▶'}</span>
      </div>
      ${body}
    </div>`;
  }).join('');
  setTimeout(bindMobileFocus,0);
}

function toggleCard(vi){
  varieties[vi].open=varieties[vi].open===false?true:false;
  renderVarieties(); saveState();
}

function updateVarietyAuto(vi){
  const v=varieties[vi];
  const properN=properForVariety(vi);
  const sampleN=v.sampleN||properN;
  const perChak=sampleN>0?v.chakSum/sampleN:0;
  const perNak=sampleN>0?v.nakSum/sampleN:0;
  const gPer=v.fcnt>0?(v.wN+v.wS*0.8)/v.fcnt:0;
  const cTot=v.cNorm+v.c50+v.c80+v.c100;
  const nTot=v.nNorm+v.n50+v.n80+v.n100;
  const cRate=cTot>0?(v.c50*0.5+v.c80*0.8+v.c100)/cTot:0;
  const nRate=nTot>0?(v.n50*0.5+v.n80*0.8+v.n100)/nTot:0;
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val;};
  set(`a-st-${vi}`,surveyTarget(v)>0?surveyTarget(v)+'주':'');
  set(`a-pn-${vi}`,properN>0?properN+'주':'');
  set(`a-pc-${vi}`,perChak>0?perChak.toFixed(1)+'개':'');
  set(`a-pncnt-${vi}`,perNak>0?perNak.toFixed(1)+'개':'');
  set(`a-gper-${vi}`,gPer>0?gPer.toFixed(2)+' g':'');
  set(`a-crate-${vi}`,cTot>0?(cRate*100).toFixed(2)+'%':'');
  set(`a-nrate-${vi}`,nTot>0?(nRate*100).toFixed(2)+'%':'');
}

function updateTotals(){
  const tSt=varieties.reduce((s,v)=>s+surveyTarget(v),0);
  const tProper=varieties.reduce((s,v,i)=>s+properForVariety(i),0);
  const tSample=varieties.reduce((s,v,i)=>s+(v.sampleN||properForVariety(i)),0);
  document.getElementById('t-survey').textContent=tSt>0?tSt.toLocaleString()+'주':'-';
  document.getElementById('t-proper').textContent=tProper>0?tProper+'주':'-';
  document.getElementById('t-sample').textContent=tSample>0?tSample+'주':'-';
}

function addVariety(){ if(_isLocked)return; varieties.push(newVariety()); renderVarieties(); updateTotals(); saveState(); }
function askDelVariety(vi){
  _delVarIdx=vi;
  document.getElementById('delvar-desc').textContent=`${varieties[vi].name||('품종'+(vi+1))} 입력값을 삭제할까요?`;
  openModal('delvar-overlay');
}
function confirmDelVariety(){
  if(_delVarIdx>=0&&varieties.length>1){ varieties.splice(_delVarIdx,1); }
  _delVarIdx=-1; closeModal('delvar-overlay');
  renderVarieties(); updateTotals(); if(_isLocked)calc(); saveState();
}

/* ===== 메인 계산 ===== */
function calc(){
  const avg=toNum('avg_yield');
  const uninsRate=(parseFloat(document.getElementById('unins_rate').value)||0)/100;
  const box=document.getElementById('result-section');
  const pctEl=document.getElementById('result-pct');
  const detail=document.getElementById('detail-section');

  // 품종별 평년수확량 안분
  const totalReg=varieties.reduce((s,v)=>s+(v.reg||0),0);
  const allHaveStd=varieties.every(v=>(v.stdPer||0)>0);
  const totalStdYield=varieties.reduce((s,v)=>s+(v.stdPer||0)*(v.reg||0),0);

  let sumYield=0,sumChak=0,sumNak=0,sumUnins=0;
  let valid=avg>0;

  varieties.forEach((v,vi)=>{
    const st=surveyTarget(v);
    const properN=properForVariety(vi);
    const sampleN=v.sampleN||properN;
    if(sampleN<=0||v.fcnt<=0){ if(st>0) valid=false; }
    const perChak=sampleN>0?v.chakSum/sampleN:0;
    const perNak=sampleN>0?v.nakSum/sampleN:0;
    const gKg=(v.fcnt>0?(v.wN+v.wS*0.8)/v.fcnt:0)/1000;
    const cTot=v.cNorm+v.c50+v.c80+v.c100;
    const nTot=v.nNorm+v.n50+v.n80+v.n100;
    const cRate=cTot>0?(v.c50*0.5+v.c80*0.8+v.c100)/cTot:0;
    const nRate=nTot>0?(v.n50*0.5+v.n80*0.8+v.n100)/nTot:0;

    // 품종별 평년수확량
    let vAvg;
    if(allHaveStd && totalStdYield>0){
      vAvg=avg*((v.stdPer||0)*(v.reg||0)/totalStdYield);
    } else {
      vAvg=totalReg>0?avg*((v.reg||0)/totalReg):0;
    }
    const perTreeAvg=(v.reg||0)>0?vAvg/(v.reg||0):0;

    const yChak=st*perChak*(1-cRate)*gKg;
    const yNak =st*perNak *(1-nRate)*gKg;
    const yUnins=perTreeAvg*(v.unins||0);
    sumChak+=yChak; sumNak+=yNak; sumUnins+=yUnins;
    sumYield+=yChak+yNak+yUnins;
  });

  if(!valid || avg<=0){
    box.className='result-box pending';
    pctEl.textContent='- -'; pctEl.style.color='#fff';
    detail.style.display='none';
    return;
  }

  const harvest=sumYield;
  const uninsLoss=Math.max(0,(avg-harvest)*uninsRate);
  const pct=Math.round((avg-harvest-uninsLoss)/avg*10000)/100;

  document.getElementById('d-avg').textContent=fmtKg(avg);
  document.getElementById('d-harvest').textContent=fmtKg(harvest);
  document.getElementById('d-chak').textContent=fmtKg(sumChak);
  document.getElementById('d-nak').textContent=fmtKg(sumNak);
  document.getElementById('d-uninstree').textContent=fmtKg(sumUnins);
  document.getElementById('d-uninsloss').textContent=fmtKg(uninsLoss);
  document.getElementById('d-pct').textContent=pct.toFixed(2)+'%';
  detail.style.display='block';

  box.className='result-box';
  pctEl.textContent=pct.toFixed(2)+'%';
  pctEl.style.color = pct<0?'#A8D8FF':'#FFD0D0';
}

/* ===== 모드 ===== */
function setCalcMode(){
  vibrate([30,40,60]);
  const miss=[];
  if(!toNum('avg_yield')) miss.push('• 평년수확량');
  varieties.forEach((v,vi)=>{
    const st=surveyTarget(v);
    if(st<=0){ miss.push(`• ${v.name||('품종'+(vi+1))}: 주수 미입력`); return; }
    const sampleN=v.sampleN||properForVariety(vi);
    const f=[];
    if(sampleN<=0) f.push('표본주수');
    if(v.fcnt<=0) f.push('과중 표본과실수');
    if((v.wN+v.wS)<=0) f.push('과중 무게');
    if(f.length) miss.push(`• ${v.name||('품종'+(vi+1))}: ${f.join('·')}`);
  });
  if(miss.length){
    document.getElementById('validation-list').innerHTML=miss.join('<br>');
    openModal('validation-overlay'); return;
  }
  calc();
  _isLocked=true;
  document.querySelector('.content').classList.add('locked');
  document.getElementById('btn-calc').classList.add('active');
  document.getElementById('btn-edit').classList.remove('active');
  setLockBadge(true);
  saveToHistory();
  saveState();
}
function setEditMode(){
  _isLocked=false;
  document.querySelector('.content').classList.remove('locked');
  document.getElementById('btn-edit').classList.add('active');
  document.getElementById('btn-calc').classList.remove('active');
  setLockBadge(false);
  vibrate([12]); saveState();
}
function setLockBadge(locked){
  const hs=document.getElementById('hdrState');
  hs.textContent=locked?'🔒 잠금':'🔓 수정 중';
  hs.className='hdr-state '+(locked?'locked':'unlocked');
}

/* ===== 상태 저장 ===== */
const LS_KEY='chestnut_state_v1';
const LS_HIST='chestnut_history_v1';
function saveState(){
  try{
    const st={
      farm_no:document.getElementById('farm_no').value,
      survey_date:document.getElementById('survey_date').value,
      avg_yield:document.getElementById('avg_yield').value,
      std_yield:document.getElementById('std_yield').value,
      unins_rate:document.getElementById('unins_rate').value,
      varieties:varieties, locked:_isLocked
    };
    localStorage.setItem(LS_KEY,JSON.stringify(st));
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return;
    const st=JSON.parse(raw);
    const set=(id,val)=>{const e=document.getElementById(id);if(e&&val!=null){e.value=val;markFilled(e);}};
    set('farm_no',st.farm_no); set('survey_date',st.survey_date);
    set('avg_yield',st.avg_yield); set('std_yield',st.std_yield); set('unins_rate',st.unins_rate);
    if(Array.isArray(st.varieties)&&st.varieties.length){
      varieties=st.varieties.map(v=>Object.assign(newVariety(),v));
    }
    renderVarieties(); updateTotals(); calc();
    if(st.locked) setCalcModeSilent();
  }catch(e){}
}
function setCalcModeSilent(){
  _isLocked=true;
  document.querySelector('.content').classList.add('locked');
  document.getElementById('btn-calc').classList.add('active');
  document.getElementById('btn-edit').classList.remove('active');
  setLockBadge(true);
}

/* ===== 기록 ===== */
function saveToHistory(){
  try{
    const hist=JSON.parse(localStorage.getItem(LS_HIST)||'[]');
    const pct=document.getElementById('result-pct').textContent;
    const rec={
      ts:Date.now(),
      farm_no:document.getElementById('farm_no').value||'-',
      survey_date:document.getElementById('survey_date').value||'-',
      pct:pct,
      state:JSON.parse(localStorage.getItem(LS_KEY)||'{}')
    };
    hist.unshift(rec);
    localStorage.setItem(LS_HIST,JSON.stringify(hist.slice(0,30)));
  }catch(e){}
}
function openHistoryModal(){
  const hist=JSON.parse(localStorage.getItem(LS_HIST)||'[]');
  const list=document.getElementById('history-list');
  if(!hist.length){ list.innerHTML='<div style="color:var(--hint);font-size:13px;padding:20px 0">저장된 기록이 없습니다</div>'; }
  else{
    list.innerHTML=hist.map((r,i)=>`<div class="hist-item" onclick="loadHistory(${i})">
      <div class="hist-main">
        <div class="hist-no">농지 ${r.farm_no} · ${r.pct}</div>
        <div class="hist-meta">${r.survey_date} · ${new Date(r.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <button class="hist-del" onclick="event.stopPropagation();delHistory(${i})">🗑</button>
    </div>`).join('');
  }
  openModal('history-overlay');
}
function loadHistory(i){
  const hist=JSON.parse(localStorage.getItem(LS_HIST)||'[]');
  const r=hist[i]; if(!r||!r.state) return;
  localStorage.setItem(LS_KEY,JSON.stringify(r.state));
  closeModal('history-overlay');
  location.reload();
}
function delHistory(i){
  const hist=JSON.parse(localStorage.getItem(LS_HIST)||'[]');
  hist.splice(i,1);
  localStorage.setItem(LS_HIST,JSON.stringify(hist));
  openHistoryModal();
}

/* ===== 초기화 ===== */
function resetAll(){
  localStorage.removeItem(LS_KEY);
  varieties=[newVariety()]; _isLocked=false;
  ['farm_no','survey_date','avg_yield','std_yield','unins_rate'].forEach(id=>{
    const e=document.getElementById(id); e.value=''; markFilled(e);
  });
  setEditMode(); renderVarieties(); updateTotals(); calc();
  closeModal('reset-overlay');
}

/* ===== 크게보기 ===== */
function toggleBigText(){
  document.body.classList.toggle('big-text');
  const on=document.body.classList.contains('big-text');
  document.getElementById('bigtext-label').textContent=on?'작게':'크게';
}

/* ===== 모바일 포커스 ===== */
function bindMobileFocus(){
  document.querySelectorAll('input.inp').forEach(el=>{
    if(el.dataset.mf==='1'||el.type==='date') return; el.dataset.mf='1';
    el.addEventListener('focus',()=>el.classList.add('mobile-focus'),{passive:true});
    el.addEventListener('blur',()=>el.classList.remove('mobile-focus'),{passive:true});
  });
}

/* ===== 이미지 저장 ===== */
async function saveImage(){
  if(document.getElementById('result-section').classList.contains('pending')){
    showToast('계산을 먼저 완료해 주세요'); return;
  }
  buildCaptureTemplate();
  showToast('이미지 생성 중…');
  try{
    const node=document.getElementById('capture-template');
    const canvas=await html2canvas(node,{backgroundColor:'#f3f4f6',scale:2,useCORS:true,windowWidth:430});
    const url=canvas.toDataURL('image/png');
    const a=document.createElement('a');
    a.href=url;
    a.download=`밤_피해율_${document.getElementById('farm_no').value||'농지'}.png`;
    a.click();
    showToast('저장되었습니다');
  }catch(e){ showToast('저장 실패'); }
}
function buildCaptureTemplate(){
  const farm=document.getElementById('farm_no').value||'-';
  const date=document.getElementById('survey_date').value||'-';
  const pct=document.getElementById('result-pct').textContent;
  const rows=[
    ['평년수확량',document.getElementById('d-avg').textContent],
    ['수확량',document.getElementById('d-harvest').textContent],
    ['└ 착과 수확량',document.getElementById('d-chak').textContent],
    ['└ 낙과 수확량',document.getElementById('d-nak').textContent],
    ['└ 미보상주수분',document.getElementById('d-uninstree').textContent],
    ['미보상감수량',document.getElementById('d-uninsloss').textContent],
  ];
  const varRows=varieties.map((v,vi)=>{
    const st=surveyTarget(v);
    const sampleN=v.sampleN||properForVariety(vi);
    const gPer=v.fcnt>0?(v.wN+v.wS*0.8)/v.fcnt:0;
    const cTot=v.cNorm+v.c50+v.c80+v.c100;
    const nTot=v.nNorm+v.n50+v.n80+v.n100;
    const cRate=cTot>0?(v.c50*0.5+v.c80*0.8+v.c100)/cTot*100:0;
    const nRate=nTot>0?(v.n50*0.5+v.n80*0.8+v.n100)/nTot*100:0;
    return `<tr>
      <td style="padding:6px 4px;border-top:1px solid #e5e7eb;font-weight:700">${v.name||('품종'+(vi+1))}${v.age?` ${v.age}년`:''}</td>
      <td style="padding:6px 4px;border-top:1px solid #e5e7eb;text-align:center">${st}/${sampleN}</td>
      <td style="padding:6px 4px;border-top:1px solid #e5e7eb;text-align:center">${gPer.toFixed(1)}g</td>
      <td style="padding:6px 4px;border-top:1px solid #e5e7eb;text-align:center">${cRate.toFixed(0)}%</td>
      <td style="padding:6px 4px;border-top:1px solid #e5e7eb;text-align:center">${nRate.toFixed(0)}%</td>
    </tr>`;
  }).join('');

  document.getElementById('capture-template').innerHTML=`
  <div style="background:linear-gradient(180deg,#1f3b63 0%,#2f80ed 14%,#f3f4f6 14%,#f3f4f6 100%);padding:0 16px 24px;box-sizing:border-box;width:430px">
    <div style="height:24px"></div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;color:#fff;margin-bottom:14px">
      <div style="font-size:16px;font-weight:800">🌰 밤 피해율 계산결과</div>
      <div style="text-align:right;font-size:13px;font-weight:700">농지 ${farm}<br>${date}</div>
    </div>
    <div style="background:#185FA5;border-radius:16px;padding:16px;color:#fff;margin-bottom:12px;text-align:center">
      <div style="font-size:13px;opacity:0.8">피해율</div>
      <div style="font-size:38px;font-weight:900;color:#FFD0D0">${pct}</div>
    </div>
    <div style="background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,0.05);margin-bottom:12px">
      <div style="font-size:14px;font-weight:900;margin-bottom:8px">산출 내역</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse">
        ${rows.map(r=>`<tr><td style="padding:6px 0;color:#555">${r[0]}</td><td style="padding:6px 0;text-align:right;font-weight:700">${r[1]}</td></tr>`).join('')}
      </table>
    </div>
    <div style="background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,0.05)">
      <div style="font-size:14px;font-weight:900;margin-bottom:8px">품종별 (${varieties.length})</div>
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <tr style="color:#888;font-size:11px"><td style="padding:0 4px 4px">품종</td><td style="padding:0 4px 4px;text-align:center">조사/표본</td><td style="padding:0 4px 4px;text-align:center">과중</td><td style="padding:0 4px 4px;text-align:center">착과피해</td><td style="padding:0 4px 4px;text-align:center">낙과피해</td></tr>
        ${varRows}
      </table>
    </div>
    <div style="text-align:center;font-size:10px;color:#9ca3af;margin-top:12px">종합위험 수확감소보장 · 수확개시 전 수확량조사 기준</div>
  </div>`;
}

/* ===== 초기화 ===== */
document.addEventListener('DOMContentLoaded',()=>{
  renderVarieties(); updateTotals(); loadState();
  bindMobileFocus();
});
</script>
</body>
</html>
