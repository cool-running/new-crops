<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>손해평가 피해율계산기 (개발)</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --blue:#185FA5;--blue2:#378ADD;
  --border:#D8D6CE;--text:#1a1a1a;--sub:#666;--hint:#aaa;
  --bg:#F5F4F0;--card:#fff;--green:#1D9E75;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-user-select:none;user-select:none;padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
.header{background:var(--blue);color:white;padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
.header-icon{width:32px;height:32px;background:rgba(255,255,255,0.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header h1{font-size:17px;font-weight:700;flex:1}
.header-sub{font-size:11px;opacity:0.7;margin-top:2px}
.dev-badge{height:24px;padding:0 10px;background:rgba(255,200,0,0.25);border:1px solid rgba(255,200,0,0.5);border-radius:8px;color:#FFE082;font-size:11px;font-weight:700;display:flex;align-items:center;flex-shrink:0}
.tab-bar{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--hint);border-bottom:2.5px solid transparent;cursor:pointer}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab-content{display:none;padding:16px 14px}
.tab-content.on{display:block}
.crop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.crop-card{background:var(--card);border-radius:var(--r);padding:20px 14px;text-align:center;border:0.5px solid var(--border);cursor:pointer;position:relative;transition:transform 0.1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.crop-card:active{transform:scale(0.97)}
.crop-card.done{border-color:var(--green)}
.crop-icon{font-size:22px;margin-bottom:10px;line-height:1.4}
.crop-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;letter-spacing:-0.02em}
.crop-desc{font-size:12px;color:var(--sub);font-weight:500}
.badge{position:absolute;top:10px;right:10px;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700}
.badge-done{background:#e8faf3;color:var(--green)}
.coming-soon{text-align:center;padding:50px 20px;color:var(--hint);font-size:13px;line-height:1.8}
.coming-soon .cs-icon{font-size:44px;margin-bottom:14px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #D8D6CE;display:flex;z-index:300;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px 8px;cursor:pointer;color:#aaa;font-size:10px;font-weight:600;gap:2px;-webkit-tap-highlight-color:transparent}
.bnav.on{color:#185FA5}
.bnav-icon{font-size:22px;line-height:1.3}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🌿</div>
  <div style="flex:1">
    <h1>피해율계산기 개발버전</h1>
    <div class="header-sub">새 작물 테스트 전용</div>
  </div>
  <div class="dev-badge">DEV</div>
</div>

<div class="tab-bar">
  <div class="tab on" onclick="switchTab(0)">밭작물</div>
  <div class="tab" onclick="switchTab(1)">과수 4종</div>
  <div class="tab" onclick="switchTab(2)">종합과수</div>
  <div class="tab" onclick="switchTab(3)">논작물</div>
</div>

<!-- 밭작물 -->
<div class="tab-content on" id="tab-0">
  <div class="crop-grid">
    <div class="crop-card done" onclick="go('ginseng')">
      <span class="badge badge-done">완성</span>
      <div class="crop-icon">🌿</div>
      <div class="crop-name">인삼</div>
      <div class="crop-desc">수확량조사</div>
    </div>
    <div class="crop-card done" onclick="go('potato')">
      <span class="badge badge-done">개발중</span>
      <div class="crop-icon">🥔</div>
      <div class="crop-name">감자</div>
      <div class="crop-desc">수확량조사</div>
    </div>
    <div class="crop-card done" onclick="go('minipumpkin')">
      <span class="badge badge-done">개발중</span>
      <div class="crop-icon">🎃</div>
      <div class="crop-name">단호박</div>
      <div class="crop-desc">수확량조사</div>
    </div>
  </div>
</div>

<!-- 과수 4종 -->
<div class="tab-content" id="tab-1">
  <div class="coming-soon">
    <div class="cs-icon">🍎</div>
    <div>개발 예정</div>
  </div>
</div>

<!-- 종합과수 -->
<div class="tab-content" id="tab-2">
  <div class="coming-soon">
    <div class="cs-icon">🍇</div>
    <div>개발 예정</div>
  </div>
</div>

<!-- 논작물 -->
<div class="tab-content" id="tab-3">
  <div class="coming-soon">
    <div class="cs-icon">🌾</div>
    <div>개발 예정</div>
  </div>
</div>

<script>
function switchTab(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',i===j));
  document.querySelectorAll('.tab-content').forEach((c,j)=>c.classList.toggle('on',i===j));
}
function go(page){
  if(page==='ginseng') location.href='./ginseng.html';
  if(page==='bean')    location.href='./bean.html';
  if(page==='potato')  location.href='./potato.html';
  if(page==='sweetpotato') location.href='./sweetpotato.html';
  if(page==='tea')         location.href='./tea.html';
  if(page==='minipumpkin') location.href='./minipumpkin.html';
  if(page==='wheat_barley_oat') location.href='./wheat_barley_oat.html';
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));
  caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
}

function bnSwitch(p){
  const isCalc = p === 'calc';
  document.getElementById('bn-calc').classList.toggle('on', isCalc);
  document.getElementById('bn-survey').classList.toggle('on', !isCalc);
  document.getElementById('survey-wrap').style.display = isCalc ? 'none' : 'block';
  if(!isCalc){
    const f = document.getElementById('survey-frame');
    if(!f.src || f.src === 'about:blank') f.src = './survey.html';
  }
}

</script>

<!-- 하단 네비게이션 -->
<div class="bottom-nav">
  <div class="bnav on" id="bn-calc" onclick="bnSwitch('calc')">
    <div class="bnav-icon">🌿</div>
    <div>피해율계산기</div>
  </div>
  <div class="bnav" id="bn-survey" onclick="bnSwitch('survey')">
    <div class="bnav-icon">📋</div>
    <div>조사관리</div>
  </div>
</div>

<!-- 조사관리 전체화면 레이어 -->
<div id="survey-wrap" style="display:none;position:fixed;inset:0 0 calc(58px + env(safe-area-inset-bottom,0px)) 0;z-index:200">
  <iframe id="survey-frame" src="" style="width:100%;height:100%;border:none" allow="clipboard-write"></iframe>
</div>

</body>
</html>
