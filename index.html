<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>손해평가 피해율계산기 (개발)</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --blue:#185FA5;--blue2:#378ADD;
  --border:#D8D6CE;--text:#1a1a1a;--sub:#666;--hint:#aaa;
  --bg:#F5F4F0;--card:#fff;--green:#1D9E75;--amber:#C2410C;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-user-select:none;user-select:none;padding-bottom:env(safe-area-inset-bottom,20px)}
.header{background:var(--blue);color:white;padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
.header-icon{width:32px;height:32px;background:rgba(255,255,255,0.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header h1{font-size:17px;font-weight:700;flex:1}
.header-sub{font-size:11px;opacity:0.7;margin-top:2px}
.dev-badge{height:24px;padding:0 10px;background:rgba(255,200,0,0.25);border:1px solid rgba(255,200,0,0.5);border-radius:8px;color:#FFE082;font-size:11px;font-weight:700;display:flex;align-items:center;flex-shrink:0}
.crop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 14px}
.crop-card{background:var(--card);border-radius:var(--r);padding:20px 14px;text-align:center;border:0.5px solid var(--border);cursor:pointer;position:relative;transition:transform 0.1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.crop-card:active{transform:scale(0.97)}
.crop-card.done{border-color:var(--green)}
.crop-card.test{border-color:var(--amber)}
.crop-icon{font-size:22px;margin-bottom:10px;line-height:1.4}
.crop-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;letter-spacing:-0.02em}
.crop-desc{font-size:12px;color:var(--sub);font-weight:500}
.badge{position:absolute;top:10px;right:10px;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700}
.badge-done{background:#e8faf3;color:var(--green)}
.badge-test{background:#FBEEE2;color:var(--amber)}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🌿</div>
  <div style="flex:1">
    <h1>피해율계산기 개발버전</h1>
    <div class="header-sub">새 작물 테스트 전용</div>
  </div>
  <div class="dev-badge">DEV</div>
</div>

<div class="crop-grid">
  <div class="crop-card done" onclick="go('ginseng')">
    <span class="badge badge-done">완성</span>
    <div class="crop-icon">🌿</div>
    <div class="crop-name">인삼</div>
    <div class="crop-desc">수확량조사</div>
  </div>

  <div class="crop-card test" onclick="go('chestnut')">
    <span class="badge badge-test">테스트</span>
    <div class="crop-icon">🌰</div>
    <div class="crop-name">밤</div>
    <div class="crop-desc">수확개시 전</div>
  </div>

  <div class="crop-card done" onclick="go('jujube')">
    <span class="badge badge-done">완성</span>
    <div class="crop-icon">🫐</div>
    <div class="crop-name">대추</div>
    <div class="crop-desc">비가림과수 · 수확량조사</div>
  </div>

</div>

<script>
function go(page){
  if(page==='ginseng')     location.href='./ginseng.html';
  if(page==='chestnut')    location.href='./chestnut.html';
  if(page==='jujube')      location.href='./jujube.html';
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister()));
  caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
}
</script>
</body>
</html>
